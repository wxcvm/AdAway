<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#141a27">
    <link rel="icon" href="data:,">
    <title>AdAway 本地服务器检查</title>
    <style>
        :root { font: 16px/1.65 system-ui, -apple-system, sans-serif; color-scheme: light dark; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
               background: #101521; color: #e8edf6; }
        main { width: 100%; max-width: 560px; padding: 30px; border: 1px solid #344055;
               border-radius: 24px; background: #1b2433; box-shadow: 0 14px 50px #0003; }
        header { display: flex; align-items: center; gap: 16px; }
        svg { width: 54px; height: 54px; flex: none; color: #92b8ff; }
        h1 { margin: 0; font-size: 1.42rem; line-height: 1.35; }
        .eyebrow { margin: 0 0 4px; color: #aab8ce; font-size: .84rem; }
        .status { margin-top: 26px; padding: 15px 18px; border-radius: 14px;
                  background: #19392f; color: #a8efd0; }
        .status strong { display: block; font-size: 1.05rem; }
        .status p { margin: 3px 0 0; }
        h2 { font-size: 1rem; margin: 24px 0 8px; }
        p { margin: 8px 0; }
        ul { padding-left: 1.3rem; margin: 8px 0 0; }
        li { margin: 5px 0; }
        code { padding: 1px 5px; border-radius: 5px; background: #2b364a;
               overflow-wrap: anywhere; }
        .note { color: #b8c5d8; }
        @media (prefers-color-scheme: light) {
            body { background: #f1f5fa; color: #202b3c; }
            main { background: #fff; border-color: #d9e2ee; box-shadow: 0 14px 45px #25344c12; }
            svg { color: #316bc6; } .eyebrow, .note { color: #53647a; }
            .status { background: #e7f8ef; color: #1c6948; }
            code { background: #edf1f6; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <path d="M24 4 40 10v12c0 11-6.7 17.4-16 22C14.7 39.4 8 33 8 22V10L24 4Z"
                  stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
            <path d="m16 24 5 5 11-12" stroke="currentColor" stroke-width="3.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
            <p class="eyebrow">AdAway · 本地诊断</p>
            <h1>网络服务器测试</h1>
        </div>
    </header>
    <section class="status" aria-label="测试结果">
        <strong>✓ 本地页面已成功响应</strong>
        <p>当前浏览器已收到 AdAway 提供的测试页面。</p>
    </section>
    <h2>这说明什么？</h2>
    <p>只证明浏览器访问的这个地址和端口能够返回页面。</p>
    <h2>还需要单独检查</h2>
    <ul>
        <li>其他 HTTP / HTTPS 监听地址是否可达。</li>
        <li>HTTPS 证书是否被信任，以及证书是否匹配访问的域名或 IP。</li>
        <li>实际广告域名是否被拦截并记录。</li>
    </ul>
    <p class="note">提示：<code>/internal-test</code> 是内部测试入口；管理端口通常为
        <code>8686</code>。若要验证实际拦截响应，请使用设置中配置的 HTTP / HTTPS
        监听地址。该页面不加载任何外部图片或脚本。</p>
</main>
</body>
</html>
