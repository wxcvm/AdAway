# SonarCloud 配置（仓库侧、可版本化的部分）
#
# ⚠️ 当前项目使用的是 SonarCloud 的 Automatic Analysis，它**不读取本文件**。
# 本文件的价值有两点：
#   1) 手工在 UI 里配置时，直接照抄下面的排除项，不必逐条想；
#   2) 以后切换到 CI 分析（推荐：可复现、且能上传覆盖率）时立即可用。
#
# 排除原则：只排第三方 vendor 与生成物。我们自己的代码——webserver/jni/webserver.c、
# webserver/win32/**、app 的 Kotlin/Java——必须被分析，那才是这份报告有用的部分。

sonar.projectKey=wxcvm_AdAway
sonar.organization=wxcvm
sonar.projectName=AdAway
sonar.sourceEncoding=UTF-8

sonar.sources=.

# ── 第三方 / 生成物：不参与分析 ──
# mongoose：内置 HTTP 库，不是我们的代码
# tcpdump / libpcap：抓包二进制与封装
# app/src/main/jni、**/build：原生与构建产物
sonar.exclusions=\
  webserver/jni/mongoose/**,\
  webserver/jni/mongoose.c,\
  webserver/jni/mongoose.h,\
  tcpdump/**,\
  app/src/main/jni/**,\
  sentrystub/**,\
  **/build/**,\
  **/*.min.js,\
  **/*.min.css

# 测试代码单独标记：Sonar 会把它们当测试（不计入覆盖率分母）
sonar.tests=app/src/test,app/src/androidTest

# ── 覆盖率（仅 CI 分析生效）──
# 仓库当前没有配 JaCoCo 报告产物，所以这一项先留注释；等加上 jacoco 报告任务后
# 取消注释并把路径改成实际输出位置——写错路径只会让分析报一条 warning，不影响构建。
# sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/testDebugUnitTestCoverage/testDebugUnitTestCoverage.xml
