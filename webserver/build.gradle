apply plugin: 'com.android.library'

android {
    compileSdk 36
    ndkVersion rootProject.ext.adawayNdkVersion
    namespace 'org.adaway.webserver'

    defaultConfig {
        minSdk rootProject.ext.adawayDisposableFixture ? 30 : rootProject.ext.adawayNativeTarget.api
        targetSdk 35
        // Matches app/build.gradle and jni/Application.mk. Without an ABI
        // filter AGP invokes ndk-build for armeabi-v7a and tries to link
        // the arm64 OpenSSL archive into a 32-bit binary.
        ndk {
            abiFilters rootProject.ext.adawayDisposableFixture ? 'arm64-v8a' : rootProject.ext.adawayNativeAbi
        }
        externalNativeBuild {
            ndkBuild {
                // The official 1.0.1 AAR supplies ARM/x86 JNI, but no RISC-V library.
                if (rootProject.ext.adawayNativeAbi == 'riscv64') targets 'webserver', 'androidx.graphics.path'
                else targets 'webserver'
            }
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'jni/Android.mk'
        }
    }

}

// OpenSSL 3.5.9 is built from pinned official source and linked statically.
// The old com.android.ndk.thirdparty:openssl:1.1.1q-beta-1 Prefab has been removed.

// Build the official OpenSSL static archives before any native compilation.
// Keeping the output under build/ avoids committing opaque binary libraries.
def officialOpenSsl = tasks.register('buildOfficialOpenSsl', Exec) {
    // AGP 9 no longer exposes android.ndkDirectory in the DSL. Resolve
    // the pinned NDK from the same SDK location AGP uses on CI and locally.
    def sdkPath = System.getenv('ANDROID_HOME') ?: System.getenv('ANDROID_SDK_ROOT')
    if (!sdkPath) {
        def props = new Properties()
        def localProps = rootProject.file('local.properties')
        if (localProps.exists()) {
            localProps.withInputStream { props.load(it) }
            sdkPath = props.getProperty('sdk.dir')
        }
    }
    if (!sdkPath) {
        throw new GradleException('Android SDK not found: set ANDROID_HOME or sdk.dir')
    }
    environment 'ANDROID_NDK_ROOT', new File(sdkPath, 'ndk/' + rootProject.ext.adawayNdkVersion).absolutePath
    environment 'ANDROID_ABI', rootProject.ext.adawayDisposableFixture ? 'arm64-v8a' : rootProject.ext.adawayNativeAbi
    workingDir projectDir
    commandLine 'bash', file('scripts/build-official-openssl.sh').absolutePath
    inputs.property('opensslRelease', '3.5.9')
    inputs.file(file('scripts/build-official-openssl.sh'))
    def abi = rootProject.ext.adawayDisposableFixture ? 'arm64-v8a' : rootProject.ext.adawayNativeAbi
    inputs.property('abi', abi)
    inputs.property('ndkVersion', rootProject.ext.adawayNdkVersion)
    outputs.files(
        layout.buildDirectory.file("official-openssl/${abi}/lib/libssl.a"),
        layout.buildDirectory.file("official-openssl/${abi}/lib/libcrypto.a"),
        layout.buildDirectory.file("official-openssl/${abi}/BUILD-COMMIT"),
        layout.buildDirectory.file("official-openssl/${abi}/BUILD-IDENTITY")
    )
}

// The source lock also includes the exact released Kotlin files for JNI contract auditing.
def officialGraphicsPath = tasks.register('prepareOfficialGraphicsPath', Exec) {
    onlyIf { rootProject.ext.adawayNativeAbi == 'riscv64' }
    workingDir projectDir
    commandLine 'python3', file('scripts/prepare-graphics-path.py').absolutePath,
            '--output', layout.buildDirectory.dir('official-graphics-path/source').get().asFile.absolutePath
    inputs.files(file('scripts/prepare-graphics-path.py'), file('scripts/graphics-path-source.json'))
    outputs.dir(layout.buildDirectory.dir('official-graphics-path/source'))
}

tasks.configureEach { t ->
    // AGP runs configureNdkBuild* (including ndk-build -n) *before* the
    // externalNativeBuild* compile task; prebuilt archives must exist already
    // at configure time, otherwise AGP aborts without running the dependency.
    if ((t.name.startsWith('configureNdkBuild') ||
         t.name.startsWith('externalNativeBuild')) &&
        !t.name.contains('Clean')) {
        t.dependsOn officialOpenSsl
        if (rootProject.ext.adawayNativeAbi == 'riscv64') t.dependsOn officialGraphicsPath
    }
}

// Each variant owns its executable and generated source directory. A command
// containing testDebugUnitTest and assembleRelease must never select one global ABI/variant.
abstract class PackageWebserverExecutable extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getNativeDirectory()
    @Input abstract Property<String> getTargetAbi()
    @Input abstract Property<Integer> getTargetMachine()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()

    @TaskAction void packageExecutable() {
        def executable = nativeDirectory.file('webserver').get().asFile
        def header = new byte[32]
        executable.withInputStream { stream ->
            if (stream.read(header) != header.length)
                throw new GradleException("Truncated native executable: ${executable}")
        }
        // ELF64 little-endian AArch64 PIE, with a real executable entry point.
        def entry = java.nio.ByteBuffer.wrap(header).order(java.nio.ByteOrder.LITTLE_ENDIAN).getLong(24)
        if (header[0] != 0x7f || header[1] != 69 || header[2] != 76 || header[3] != 70 ||
                header[4] != 2 || header[5] != 1 || (header[18] & 0xff) != targetMachine.get() || header[19] != 0 || entry == 0)
            throw new GradleException("Not an executable for ${targetAbi.get()} (placeholder libraries are forbidden): ${executable}")
        def abi = targetAbi.get()
        project.sync {
            into outputDirectory
            from(executable) {
                into abi
                rename { 'libwebserver_exec.so' }
            }
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        // Disposable x86 Room/UI tests deliberately omit the production ARM64 server.
        if (!rootProject.ext.adawayDisposableFixture) {
            def capitalized = variant.name.capitalize()
            def packageTask = tasks.register("package${capitalized}WebserverExecutable", PackageWebserverExecutable) {
                dependsOn "externalNativeBuild${capitalized}"
                targetAbi.set(rootProject.ext.adawayNativeAbi)
                targetMachine.set(rootProject.ext.adawayNativeTarget.machine)
                nativeDirectory.set(layout.buildDirectory.dir("intermediates/ndkBuild/${variant.name}/obj/local/${rootProject.ext.adawayNativeAbi}"))
                outputDirectory.set(layout.buildDirectory.dir("generated/webserverJniLibs/${variant.name}"))
            }
            variant.sources.jniLibs.addGeneratedSourceDirectory(packageTask, { it.outputDirectory })
        }
    }
}
