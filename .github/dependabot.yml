# Dependabot configuration for automatic dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ── Gradle dependencies (Android + Java) ──────────────────────
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    # Group AndroidX and other related updates together to reduce PR noise
    groups:
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.material"
      testing:
        patterns:
          - "junit*"
          - "androidx.test*"
          - "androidx.arch.core*"
      gradle-build:
        patterns:
          - "com.android.tools.build*"
      okhttp:
        patterns:
          - "com.squareup.okhttp3*"
      sentry:
        patterns:
          - "io.sentry*"
    labels:
      - "dependencies"
      - "gradle"
    # Limit open PRs to avoid overwhelming the maintainer
    open-pull-requests-limit: 5
    # Auto-rebase when other PRs merge
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(deps):"
      prefix-development: "chore(deps-dev):"
      include: "scope"

  # ── GitHub Actions dependencies ───────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    labels:
      - "dependencies"
      - "ci"
    groups:
      gh-actions-packages:
        patterns:
          - "*"
    open-pull-requests-limit: 3
    rebase-strategy: "auto"
    commit-message:
      prefix: "chore(ci):"
      include: "scope"
