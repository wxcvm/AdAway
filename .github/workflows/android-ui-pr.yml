name: Android Compose UI PR build

on:
  push:
    branches:
      - refactor/ui-overview-logs-20261017
  pull_request:
    paths:
      - 'app/src/main/java/org/adaway/ui/compose/**'
      - 'app/src/main/res/values/strings_compose.xml'
      - 'app/src/main/res/values-zh/strings_compose.xml'
      - 'app/src/main/res/values*/strings_observations.xml'
      - 'app/src/main/res/values*/strings_responses.xml'
      - 'app/src/androidTest/java/org/adaway/ui/compose/ObservationUiTest.kt'
      - 'app/src/androidTest/java/org/adaway/ui/compose/ResponseCheckUiTest.kt'
      - 'app/src/main/java/org/adaway/util/ListenerResponseCheck.java'
      - 'app/src/test/java/org/adaway/ui/compose/ObservationStateTest.kt'
      - 'app/src/test/java/org/adaway/util/ListenerResponseCheckTest.java'
      - 'app/src/test/resources/response-name-only-test.p12'
      - '.github/workflows/android-ui-pr.yml'
  workflow_dispatch:

concurrency:
  group: compose-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compose compilation and JVM regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate network center reservations and translations
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          nav = Path("app/src/main/java/org/adaway/ui/compose/AdAwayApp.kt").read_text()
          screen = Path("app/src/main/java/org/adaway/ui/compose/NetworkCenterScreen.kt").read_text()
          assert "Destinations.NETWORK" in nav and "NetworkCenterScreen(" in nav
          assert "onOpenSettings" in screen and "onOpenRules" in screen
          assert "PlannedCapability" in screen
          assert "compose_network_planned" in screen
          keys = {
              "compose_nav_network", "compose_network_capture_title",
              "compose_network_adguard_title", "compose_network_dns_title",
              "compose_network_https_title", "compose_network_recovery_title",
              "compose_network_not_active", "compose_network_planned",
          }
          for path in ("app/src/main/res/values/strings_compose.xml",
                       "app/src/main/res/values-zh/strings_compose.xml"):
              found = {e.attrib["name"] for e in ET.parse(path).getroot().iter("string")}
              assert keys <= found, (path, keys - found)
          print("Network center navigation and pending feature labels are present")
          PY
      - name: Compile Compose UI and run full JVM regressions
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace -PruleLoaderTestAbi=x86_64 -Pandroid.injected.build.abi=x86_64
      - name: Upload JVM regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-observation-jvm-results
          path: app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn

  interaction:
    name: Rule workflow UI and screenshots (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual UI components without root or network actions
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -PruleLoaderTestAbi=x86_64 -Pandroid.injected.build.abi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=org.adaway.ui.compose.RuleWorkflowUiTest
            adb pull /sdcard/Pictures/AdAwayUiReview ui-review
      - name: Upload UI screenshots and interaction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-rule-workflow-ui
          path: |
            ui-review/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn

  observations:
    name: Stable observation frames and responses (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable disposable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test real settings entry frames without disabling animations
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: false
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -PruleLoaderTestAbi=x86_64 -Pandroid.injected.build.abi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=org.adaway.ui.compose.ObservationUiTest,org.adaway.ui.compose.ResponseCheckUiTest
      - name: Pull observation frames and failure evidence
        if: always()
        run: |
          adb pull /sdcard/Pictures/AdAwayUiReview observation-ui || true
          adb pull /sdcard/Download/AdAwayUiReview observation-manifests || true
      - name: Upload continuous observation frames and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-observation-ui-api-${{ matrix.api }}
          path: |
            observation-ui/**
            observation-manifests/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
