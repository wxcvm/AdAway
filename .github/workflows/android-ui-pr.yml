name: Android Compose UI PR build

on:
  push:
    branches:
      - refactor/ui-overview-logs-20261017
  pull_request:
    paths:
      - 'app/src/main/java/org/adaway/ui/compose/**'
      - '.github/workflows/android-ui-pr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compose Kotlin compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Compile Compose UI
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace
