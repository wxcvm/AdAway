name: Android progress preview Release
on:
  push:
    tags: ['progress-android-*']
    # A dedicated branch is a controlled release request. Ordinary master
    # pushes and PRs NEVER publish preview artifacts.
    branches: ['preview/release-*']
permissions:
  contents: read

jobs:
  preview:
    concurrency:
      group: android-preview-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # A failed ABI build blocks publication; never substitute an ARM64 APK.
      PREVIEW_ABIS: 'arm64-v8a x86_64 riscv64'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate explicit preview release target
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/progress-android-*)
              tag="${GITHUB_REF_NAME}"
              ;;
            refs/heads/preview/release-*)
              tag="progress-android-${GITHUB_REF_NAME#preview/release-}"
              ;;
            *)
              echo "::error::not an authorized preview ref"; exit 1;;
          esac
          [[ "$tag" =~ ^progress-android-[0-9]{8}\.[0-9]+$ ]] || {
            echo "::error::preview tag must be dated, unique and immutable"; exit 1;
          }
          echo "PREVIEW_TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::this preview tag already exists; refusing overwrite"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check emitted JSON field contract before preview build
        run: |
          python3 tools/check_stats_contract.py
          python3 -m unittest discover -s tools -p 'test_check_stats_contract.py'
          python3 -m unittest discover -s tools -p 'test_prepare_preview_feed.py'

      - name: Build and verify ABI-specific production-identity release APKs
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.1.13356709'
          version_name="6.7.6-preview.${GITHUB_RUN_NUMBER}"
          version_code=$(($(date -u +%s) - 1577836800))
          echo "PREVIEW_VERSION_NAME=$version_name" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION_CODE=$version_code" >> "$GITHUB_ENV"
          for abi in $PREVIEW_ABIS; do
            stage="$RUNNER_TEMP/android-preview-$abi"
            mkdir -p "$stage"
            # Preserve the complete prior preview before switching Gradle's ABI.
            # Inputs declare ABI; each APK is checked against this ABI's own
            # executable outputs and is copied away before the next build.
            tasks=(:app:assembleRelease)
            if [[ "$abi" == arm64-v8a ]]; then tasks=(:app:testDebugUnitTest "${tasks[@]}"); fi
            ./gradlew "${tasks[@]}" --no-daemon --max-workers=2 \
              -PversionName="$version_name" -PversionCode="$version_code" \
              -PnativeAbi="$abi" -Pandroid.injected.build.abi="$abi"
            python3 tools/verify_webserver_apk.py --apk-root app/build --variant release --abi "$abi" \
              --executable "webserver/build/generated/webserverJniLibs/release/$abi/libwebserver_exec.so" \
              --write-apk-path-file "$stage/verified-apk.txt" | tee "$stage/NATIVE-VERIFICATION.txt"
            cp -- "$(cat "$stage/verified-apk.txt")" "$stage/unsigned.apk"
            cp -- "webserver/build/generated/webserverJniLibs/release/$abi/libwebserver_exec.so" "$stage/libwebserver_exec.so"
            cp -- "tcpdump/build/generated/tcpdumpJniLibs/release/$abi/libtcpdump_exec.so" "$stage/libtcpdump_exec.so"
            if [[ "$abi" == riscv64 ]]; then
              cp -- "webserver/build/intermediates/ndkBuild/release/obj/local/riscv64/libandroidx.graphics.path.so" "$stage/libandroidx.graphics.path.so"
            fi
          done

      - name: Run native loader regressions before publication
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-test"
          directory=$(mktemp -d)
          "$RUNNER_TEMP/domain-test" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-test"
          "$RUNNER_TEMP/block-test"

      - name: Sign preview using SAME production Android keystore and verify fingerprint
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::production signing secret $var is unavailable"; exit 1
            fi
          done
          mkdir -p release-assets "$RUNNER_TEMP/reference-release"
          chmod 700 release-assets
          keystore="$RUNNER_TEMP/preview-release.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
          test -s "$keystore"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [[ ! -d "$sdk_root/build-tools" ]]; then
            echo "::error::Android SDK build tools missing from $sdk_root"; exit 1
          fi
          bt=""
          while IFS= read -r candidate; do
            if [[ -x "$candidate/apksigner" && -x "$candidate/aapt" ]]; then
              bt="$candidate"; break
            fi
          done < <(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -Vr)
          if [[ -z "$bt" ]]; then
            echo "::error::No installed Android build-tools version offers both apksigner and aapt"
            find "$sdk_root/build-tools" -maxdepth 2 -type f | grep -E "/(aapt|apksigner)$" || true
            exit 1
          fi
          echo "Using Android build tools: ${bt##*/}"
          # The reference is the actual current stable production APK, fetched
          # once. Every ABI must verify against that same signer independently.
          stable_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$stable_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::latest stable release is not a production Android version"; exit 1;
          }
          gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ADBlock-latest.apk' --dir "$RUNNER_TEMP/reference-release"
          "$bt/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/reference-release/ADBlock-latest.apk" > "$RUNNER_TEMP/stable-signature.txt"
          "$bt/aapt" dump badging "$RUNNER_TEMP/reference-release/ADBlock-latest.apk" > "$RUNNER_TEMP/stable-identity.txt"
          stable_code=$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" "$RUNNER_TEMP/stable-identity.txt" | head -1)
          test "$PREVIEW_VERSION_CODE" -gt "$stable_code" || { echo "::error::preview must upgrade current stable versionCode"; exit 1; }
          export SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD
          for abi in $PREVIEW_ABIS; do
            case "$abi" in
              arm64-v8a) slug=arm64; suffix='' ;;
              x86_64) slug=x86_64; suffix=-x86_64 ;;
              riscv64) slug=riscv64; suffix=-riscv64 ;;
              *) echo '::error::unrecognized preview ABI'; exit 1 ;;
            esac
            stage="$RUNNER_TEMP/android-preview-$abi"
            unsigned="$stage/unsigned.apk"
            test -s "$unsigned"
            apk="release-assets/AdAway-preview-$slug.apk"
            signature="release-assets/APK-SIGNATURE$suffix.txt"
            identity="release-assets/APK-IDENTITY$suffix.txt"
            "$bt/apksigner" sign --ks "$keystore" \
              --ks-pass env:SIGNING_STORE_PASSWORD --ks-key-alias "$SIGNING_KEY_ALIAS" \
              --key-pass env:SIGNING_KEY_PASSWORD --out "$apk" "$unsigned"
            "$bt/apksigner" verify --verbose --print-certs "$apk" > "$signature"
            "$bt/aapt" dump badging "$apk" > "$identity"
            grep -Fq "package: name='com.wxcvm.Adaway'" "$identity"
            grep -Fq "versionCode='$PREVIEW_VERSION_CODE' versionName='$PREVIEW_VERSION_NAME'" "$identity"
            grep -Fq "native-code: '$abi'" "$identity"
            python3 tools/compare_apk_signers.py "$RUNNER_TEMP/stable-signature.txt" "$signature"
            cp "$stage/NATIVE-VERIFICATION.txt" "release-assets/NATIVE-VERIFICATION-$abi.txt"
            python3 tools/verify_webserver_apk.py --apk "$apk" --variant release --abi "$abi" \
              --executable "$stage/libwebserver_exec.so" --tcpdump-executable "$stage/libtcpdump_exec.so" \
              --graphics-path-library "$stage/libandroidx.graphics.path.so" \
              | tee -a "release-assets/NATIVE-VERIFICATION-$abi.txt"
          done

      - name: Verify bundled preview status and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat docs/content-response-settings.md docs/android-abi-preview-contract.md docs/android-native-builds.md docs/android-abi-updates.md docs/activity-and-update-contract.md docs/query-log-family-format.md docs/listener-arrival.md docs/response-policy-regressions.md docs/listener-settings.md docs/listener-lifecycle.md docs/dual-stack-transport.md docs/tcp-backend.md > release-assets/IMPLEMENTATION-STATUS.md
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE-COMMIT.txt
          printf '%s\n' "Preview signature: same signing certificate as current published Android stable APK." > release-assets/SIGNING-POLICY.txt
          python3 tools/prepare-preview-feed.py
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Publish signed, in-place inspection prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          Android ABI-specific opt-in progress preview for inspection.
          ARM64 and x86_64 require Android 11/API30 or later. RISC-V requires
          API35 or later and remains a provisional Google Android ABI.
          RISC-V build/signature checks do not establish device or emulator
          acceptance; no RISC-V runtime acceptance is claimed.

          Package identity is com.wxcvm.Adaway: this APK upgrades the installed
          production app in place and preserves app data. No parallel app is installed.
          This preview is signed by the SAME Android signing certificate as
          the repository's latest production APK; a verified certificate
          SHA-256 digest is attached. Version code is verified to exceed the
          current stable APK before publication. Stable feeds remain unchanged.

          Includes custom HTTP/HTTPS listening IP, port conflict checks and
          rollback to previous settings on application failure.
          Includes scoped TUN and DNS-policy wire foundation. This does NOT
          implement default whole-device routing or unrestricted DNS/TCP/UDP
          forwarding. No production update feeds are changed.

          All ABI APKs share one versionCode/versionName and production signer.
          Legacy clients keep the ARM64 URL; ABI-aware clients use the artifacts
          map. Source revision, per-ABI identity/signature/native verification,
          status and checksums are attached.
          NOTES
          cat docs/content-response-settings.md docs/android-abi-preview-contract.md docs/listener-lifecycle.md >> "$RUNNER_TEMP/preview-notes.md"
          cat docs/preview-updates.md >> "$RUNNER_TEMP/preview-notes.md"
          cat docs/dual-stack-transport.md docs/tcp-backend.md >> "$RUNNER_TEMP/preview-notes.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$PREVIEW_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --latest=false \
              --title "AdAway Android signed preview $PREVIEW_TAG" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          else
            gh release create "$PREVIEW_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "AdAway Android signed preview $PREVIEW_TAG" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
          python3 tools/publish-preview-channel.py
