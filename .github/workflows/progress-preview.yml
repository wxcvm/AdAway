name: Android progress preview Release
on:
  push:
    tags: ['progress-android-*']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test and build the separate ARM64 preview application
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 \
            -PprogressPreview=true -PversionName=6.7.5-preview.${GITHUB_RUN_NUMBER} \
            -PversionCode=$((607050000 + GITHUB_RUN_NUMBER)) -Pandroid.injected.build.abi=arm64-v8a
      - name: Run native loader regressions before publication
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-test"
          directory=$(mktemp -d)
          "$RUNNER_TEMP/domain-test" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-test"
          "$RUNNER_TEMP/block-test"
      - name: Verify identity, APK signature and package contents
        run: |
          mkdir release-assets
          apk=$(find app/build -path '*/apk/debug/*.apk' -type f | head -1)
          test -n "$apk"
          cp "$apk" release-assets/AdAway-preview-arm64.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/apksigner" verify --verbose --print-certs release-assets/AdAway-preview-arm64.apk > release-assets/APK-SIGNATURE.txt
          "$bt/aapt" dump badging release-assets/AdAway-preview-arm64.apk > release-assets/APK-IDENTITY.txt
          grep -q "package: name='com.wxcvm.Adaway.preview'" release-assets/APK-IDENTITY.txt
          grep -q "native-code: 'arm64-v8a'" release-assets/APK-IDENTITY.txt
          unzip -l release-assets/AdAway-preview-arm64.apk | grep 'lib/arm64-v8a/libwebserver_exec.so'
          cp docs/m1-rule-loader-validation.md release-assets/IMPLEMENTATION-STATUS.md
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE-COMMIT.txt
          (cd release-assets && sha256sum * > SHA256SUMS.txt)
      - name: Publish the inspection prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          Android ARM64 progress preview for inspection (Android 11+).

          Install `AdAway-preview-arm64.apk`. Package identity is `com.wxcvm.Adaway.preview`; the launcher says **AdAway Preview**, so the existing production app/data can remain installed. The APK uses the standard CI debug signing key; its fingerprint is attached. This is not a signed production upgrade and future preview signing continuity is not promised. Update previews manually; production update feeds are not used by this preview.

          Implemented: bounded transactional Hosts/ABP import, failed-update rollback, rule priority fixes, atomic native snapshot reload and atomic app-written rule files. Native strict/concurrency/300,000-entry and JVM tests run before this publication. Implementation detail, limits and open acceptance are attached in `IMPLEMENTATION-STATUS.md`.

          Not yet complete: full typed cross-platform rule provenance/suffix bridge, protected TCP/UDP backend, production DNS/TTL/CNAME handling, default VPN routing, real Windows network recovery, verified AdGuard coexistence and physical-device E2E. Existing diagnostics remain scoped. Do not interpret a successful build as verified whole-device protection.

          This prerelease does not merge draft PRs or update `android-latest`. Source commit, APK identity/signature and SHA-256 checksums are attached.
          NOTES
          gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --prerelease --latest=false --title "AdAway Android progress preview $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/preview-notes.md"
