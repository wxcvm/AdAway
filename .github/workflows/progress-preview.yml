name: Android progress preview Release
on:
  push:
    tags: ['progress-android-*']
    # A dedicated branch is a controlled release request. Ordinary master
    # pushes and PRs NEVER publish preview artifacts.
    branches: ['preview/release-*']
permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate explicit preview release target
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/tags/progress-android-*)
              tag="${GITHUB_REF_NAME}"
              ;;
            refs/heads/preview/release-*)
              tag="progress-android-${GITHUB_REF_NAME#preview/release-}"
              ;;
            *)
              echo "::error::not an authorized preview ref"; exit 1;;
          esac
          [[ "$tag" =~ ^progress-android-[0-9]{8}\\.[0-9]+$ ]] || {
            echo "::error::preview tag must be dated, unique and immutable"; exit 1;
          }
          echo "PREVIEW_TAG=$tag" >> "$GITHUB_ENV"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::this preview tag already exists; refusing overwrite"; exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build separately installable ARM64 release-variant preview
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2 \
            -PprogressPreview=true -PversionName=6.7.5-preview.${GITHUB_RUN_NUMBER} \
            -PversionCode=$((607050000 + GITHUB_RUN_NUMBER)) \
            -Pandroid.injected.build.abi=arm64-v8a

      - name: Run native loader regressions before publication
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-test"
          directory=$(mktemp -d)
          "$RUNNER_TEMP/domain-test" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-test"
          "$RUNNER_TEMP/block-test"

      - name: Sign preview using SAME production Android keystore and verify fingerprint
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for var in SIGNING_KEYSTORE_BASE64 SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              echo "::error::production signing secret $var is unavailable"; exit 1
            fi
          done
          mkdir -p release-assets "$RUNNER_TEMP/reference-release"
          chmod 700 release-assets
          keystore="$RUNNER_TEMP/preview-release.jks"
          trap 'rm -f "$keystore"' EXIT
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$keystore"
          test -s "$keystore"
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          bt=$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -n "$bt" && test -x "$bt/apksigner" && test -x "$bt/aapt"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$unsigned"
          export SIGNING_STORE_PASSWORD SIGNING_KEY_PASSWORD
          "$bt/apksigner" sign --ks "$keystore" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out release-assets/AdAway-preview-arm64.apk "$unsigned"
          "$bt/apksigner" verify --verbose --print-certs release-assets/AdAway-preview-arm64.apk > release-assets/APK-SIGNATURE.txt
          "$bt/aapt" dump badging release-assets/AdAway-preview-arm64.apk > release-assets/APK-IDENTITY.txt
          grep -Fq "package: name='com.wxcvm.Adaway.preview'" release-assets/APK-IDENTITY.txt
          grep -Fq "native-code: 'arm64-v8a'" release-assets/APK-IDENTITY.txt
          unzip -l release-assets/AdAway-preview-arm64.apk | grep -Fq 'lib/arm64-v8a/libwebserver_exec.so'

          # Reference must be an actual stable production APK from this same
          # repository, not the former CI-debug-signed preview.
          stable_tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ "$stable_tag" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+$ ]] || {
            echo "::error::latest stable release is not a production Android version"; exit 1;
          }
          gh release download "$stable_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern 'ADBlock-latest.apk' --dir "$RUNNER_TEMP/reference-release"
          "$bt/apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/reference-release/ADBlock-latest.apk" > "$RUNNER_TEMP/stable-signature.txt"
          python3 - "$RUNNER_TEMP/stable-signature.txt" release-assets/APK-SIGNATURE.txt <<'PY'
          import pathlib, re, sys
          def fingerprint(path):
              contents = pathlib.Path(path).read_text()
              values = re.findall(r"Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]{64})", contents)
              if len(values) != 1:
                  raise SystemExit("signature certificate fingerprint missing or ambiguous")
              return values[0].lower()
          production = fingerprint(sys.argv[1])
          preview = fingerprint(sys.argv[2])
          if production != preview:
              raise SystemExit("Preview signer does NOT match published production signer; publication refused")
          print("PASS: preview and production certificates share SHA-256:", preview)
          PY

      - name: Verify bundled preview status and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp docs/m1-rule-loader-validation.md release-assets/IMPLEMENTATION-STATUS.md
          printf '%s\n' "$GITHUB_SHA" > release-assets/SOURCE-COMMIT.txt
          printf '%s\n' "Preview signature: same signing certificate as current published Android stable APK." > release-assets/SIGNING-POLICY.txt
          (cd release-assets && sha256sum * > SHA256SUMS.txt)

      - name: Publish signed, isolated inspection prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/preview-notes.md" <<'NOTES'
          Android ARM64 opt-in progress preview for inspection (Android 11+).

          Preview package identity is com.wxcvm.Adaway.preview, allowing it
          to coexist with the installed com.wxcvm.Adaway production app.
          This preview is signed by the SAME Android signing certificate as
          the repository's latest production APK; a verified certificate
          SHA-256 digest is attached. Different app IDs still mean Android
          does NOT treat this APK as an in-place production upgrade.

          Includes scoped TUN and DNS-policy wire foundation. This does NOT
          implement default whole-device routing or unrestricted DNS/TCP/UDP
          forwarding. No production update feeds are changed.

          Source revision, identity, signature, status and checksums attached.
          NOTES
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$PREVIEW_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --prerelease --latest=false \
              --title "AdAway Android signed preview $PREVIEW_TAG" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          else
            gh release create "$PREVIEW_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "AdAway Android signed preview $PREVIEW_TAG" \
              --notes-file "$RUNNER_TEMP/preview-notes.md"
          fi
