name: Update default block image

# Convenience for maintainers: paste an image URL, pick a slot, click
# "Run workflow" - it downloads the image, converts it to WebP, and
# commits it straight to app/src/main/assets/. No local git/Python
# tooling needed.
#
# (GitHub's own "Add file > Upload files" web UI on the assets/ folder
# is an equally valid, even simpler option if you'd rather drag-and-drop
# a file directly - this workflow is for when you already have an image
# hosted somewhere and just want to point at the URL.)

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Direct URL to the image (jpg/png/webp)'
        required: true
        type: string
      slot:
        description: >-
          Slot number (0-99, matches img_NN.webp - the count is no
          longer fixed at 7, see webserver.c's count_block_images()),
          or "all" to replace every slot that currently exists in
          app/src/main/assets/
        required: true
        type: string
        default: 'all'

permissions:
  contents: write

jobs:
  update-block-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download image
        run: |
          set -euo pipefail
          curl -fL "${{ inputs.image_url }}" -o /tmp/source_image
          file /tmp/source_image

      - name: Install cwebp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Convert and place image(s)
        run: |
          set -euo pipefail
          DEST=app/src/main/assets
          if [ "${{ inputs.slot }}" = "all" ]; then
            # BUG FIX: this used to stop at the first missing index
            # (a "while -f img_NN.<ext>" loop starting from 0), on the
            # assumption that slots are always contiguous from 0 - an
            # assumption that matched an older version of
            # scan_block_images() in webserver.c but not the current
            # one, which explicitly scans the whole directory so
            # deleting/adding a slot never requires renaming the rest.
            # Once the assets directory actually had a gap (img_02 is
            # followed by img_06, not img_03), this silently updated
            # only img_00-img_02 and skipped every slot from img_06
            # onward with no warning. Glob for every existing slot
            # instead, matching what scan_block_images() itself does.
            SLOTS=""
            shopt -s nullglob
            for f in "$DEST"/img_*.webp "$DEST"/img_*.png "$DEST"/img_*.jpg "$DEST"/img_*.jpeg; do
              base=$(basename "$f")
              base="${base%.*}"
              slot_num="${base#img_}"
              # Only numbered slots (img_00, img_07, ...) are in scope
              # here - a non-numeric name (img_cat.webp) is a valid
              # block image but not something this "replace slot N"
              # workflow knows how to target, so leave it alone.
              case "$slot_num" in
                ''|*[!0-9]*) continue ;;
              esac
              # Strip leading zeros via forced base-10 arithmetic -
              # bash's printf/arithmetic treat a leading-zero numeral
              # like "08"/"09" as (invalid) octal otherwise, which
              # would abort this script with "value too great for
              # base" the first time a two-digit slot starting with 0
              # was found (every slot from img_00 to img_09).
              slot_num=$((10#$slot_num))
              case " $SLOTS " in
                *" $slot_num "*) ;; # already recorded (e.g. two extensions for the same slot)
                *) SLOTS="$SLOTS $slot_num" ;;
              esac
            done
            if [ -z "$SLOTS" ]; then
              echo "No existing slots found in $DEST - pass a specific slot number instead of 'all' to add the first one."
              exit 1
            fi
          else
            SLOTS="${{ inputs.slot }}"
          fi
          for s in $SLOTS; do
            printf -v padded "%02d" "$s"
            cwebp -q 85 /tmp/source_image -o "$DEST/img_${padded}.webp"
            echo "Wrote $DEST/img_${padded}.webp"
          done

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/img_*.webp
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update default block image (slot: ${{ inputs.slot }})

          Source: ${{ inputs.image_url }}
          Triggered by: ${{ github.actor }}"
          git push
