name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*' 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build with Gradle
        run: |
          VERSION_CODE=$(date +%s)
          VERSION_NAME="6.5.0.${{ github.run_number }}"
          echo "Building $VERSION_NAME (versionCode $VERSION_CODE)"
          echo "$VERSION_NAME|$VERSION_CODE" > version.txt
          ./gradlew assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --stacktrace

      - name: Sign release APK with release key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADBlock-release-signed
          path: |
            app/build/outputs/apk/release/app-release-signed.apk
            version.txt
        

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: ADBlock-release-signed
          path: release-assets

      - name: Prepare release assets
        run: |
          # Find the APK and version.txt regardless of nested structure
          APK_FILE=$(find release-assets -name 'app-release-signed.apk' | head -1)
          VERSION_FILE=$(find release-assets -name 'version.txt' | head -1)
          if [ -z "$APK_FILE" ] || [ -z "$VERSION_FILE" ]; then
            echo "Missing files"
            find release-assets -type f
            exit 1
          fi
          VERSION_NAME=$(cut -d'|' -f1 "$VERSION_FILE")
          VERSION_CODE=$(cut -d'|' -f2 "$VERSION_FILE")
          cp "$APK_FILE" release-assets/ADBlock-latest.apk
          printf '{"version":"%s","versionCode":%s,"changelog":"New Material 3 UI, per-app stats, ADBlock branding, dynamic versioning, captive portal fix"}' "$VERSION_NAME" "$VERSION_CODE" > release-assets/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}