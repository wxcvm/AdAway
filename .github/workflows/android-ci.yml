name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6

      # G1：原生纯函数的宿主机测试。只依赖标准库与 ubuntu-latest 自带的 cc，
      # 不碰 NDK/mongoose/OpenSSL，因此几秒钟就能跑完，适合放在最前面尽早失败。
      # 关键点：规则归一化与修饰符判据由服务端与测试共用同一份实现
      # （webserver/jni/rule_norm.h，服务端 include 它），所以这一步失败就意味着
      # 线上语义被改动，而不是"测试和实现各写一份"。
      # 刻意不加 -Werror：警告要看得见，但不该用无关警告把构建弄红；结论由测试退出码给出。
      - name: Native rule-normalisation tests
        run: |
          cc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/rule_norm_test" webserver/jni/rule_norm_test.c
          "$RUNNER_TEMP/rule_norm_test"
          cc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/pin_window_test" webserver/jni/pin_window_test.c
          "$RUNNER_TEMP/pin_window_test"
          cc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/f5_guard_test" webserver/jni/f5_guard_test.c
          "$RUNNER_TEMP/f5_guard_test"
          cc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/cosmetic_sanitize_test" webserver/jni/cosmetic_sanitize_test.c
          "$RUNNER_TEMP/cosmetic_sanitize_test"
          cc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/cosmetic_scope_test" webserver/jni/cosmetic_scope_test.c
          "$RUNNER_TEMP/cosmetic_scope_test"
          cc -std=c11 -Wall -Wextra -o "$RUNNER_TEMP/lt_map_test" webserver/jni/lt_map_test.c
          "$RUNNER_TEMP/lt_map_test"

      # 契约守卫（G4）：block_config.json 的键清单必须与实际读取的键**逐一相同**。
      # 左边 = 服务端真正读取的键（webserver.c 里 jbool(...) 的第二个参数）；
      # 右边 = docs/windows-core-contract.md 第 1 节表格里记录的键。
      # 任何一边多出或缺少键，这里就失败 —— 避免"加了键却没更新契约"或"契约写了代码没有"。
      - name: Config key contract guard
        run: |
          set -euo pipefail
          code_keys=$(grep -oE 'jbool\([^,]+, *"[a-z0-9_]+"' webserver/jni/webserver.c \
                      | grep -oE '"[a-z0-9_]+"' | tr -d '"' | sort -u)
          doc_keys=$(sed -n '/^## 1\./,/^## 2\./p' docs/windows-core-contract.md \
                      | grep -oE '`[a-z][a-z0-9_]*_[a-z0-9_]+`' | tr -d '`' | sort -u)
          echo "代码读取的键（$(echo "$code_keys" | wc -l) 个）："; echo "$code_keys"
          echo "契约记录的键（$(echo "$doc_keys" | wc -l) 个）："; echo "$doc_keys"
          if ! diff -u <(echo "$doc_keys") <(echo "$code_keys"); then
            echo "::error::block_config.json 键清单与契约不一致：左边是契约、右边是代码（见上）"
            exit 1
          fi
          echo "契约与代码的键清单完全一致 ✓"

      # 契约守卫 2（G4）：/internal-stats 的字段清单也必须与代码**逐一相同**。
      # 左边 = 服务端实际输出的 JSON 键（webserver.c 里的 "key": 与转义的 \"key\": 两种写法）；
      # 右边 = docs/windows-core-contract.md 第 2 节表格里记录的字段。
      - name: Stats field contract guard
        run: |
          set -euo pipefail
          code_keys=$( { grep -oE '\\"[a-z][a-z0-9_]{2,40}\\"[[:space:]]*:' webserver/jni/webserver.c | sed -E 's/.*\\"([a-z0-9_]+)\\".*/\1/'
                         grep -oE '(^|[^\\])"[a-z][a-z0-9_]{2,40}"[[:space:]]*:' webserver/jni/webserver.c | sed -E 's/.*"([a-z0-9_]+)".*/\1/' ; } | sort -u)
          doc_keys=$(sed -n '/^## 2\./,/^## 3\./p' docs/windows-core-contract.md \
                      | grep -oE '`[a-z][a-z0-9_]{2,40}`' | tr -d '`' | sort -u)
          echo "代码输出的字段（$(echo "$code_keys" | wc -l) 个）"; echo "$code_keys"
          echo "契约记录的字段（$(echo "$doc_keys" | wc -l) 个）"; echo "$doc_keys"
          if ! diff -u <(echo "$doc_keys") <(echo "$code_keys"); then
            echo "::error::/internal-stats 字段清单与契约不一致：左边是契约、右边是代码（见上）"
            exit 1
          fi
          echo "/internal-stats 字段与契约完全一致 ✓"

      # 契约守卫 3（文档卫生）：文档里每个 §N / §N.M 引用都必须解析到同编号标题。
      # 起因：手写引用曾多次指错（写成不存在的 §4.1、把确实存在的 §5.2 误判为悬空）。
      - name: Doc cross-reference guard
        run: python3 tools/check_doc_refs.py

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      # Native OpenSSL is built from the official immutable upstream commit.
      # Cache only the built arm64 libraries/headers, not a moving source tree.
      # The build script checks BUILD-COMMIT before using the cached archives.
      - name: Restore pinned Android OpenSSL build
        uses: actions/cache@v4
        with:
          path: webserver/build/official-openssl/arm64-v8a
          key: official-openssl-arm64-ndk28-${{ runner.os }}-${{ hashFiles('webserver/scripts/build-official-openssl.sh') }}

      - name: Install ccache (native builds)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache
          # Pin the cache directory (ccache 4.x moved the Linux default to
          # ~/.cache/ccache) so the cache step below always finds it.
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "NDK_CCACHE=$(which ccache)" >> "$GITHUB_ENV"

      # webserver.c + mongoose + OpenSSL and libpcap/tcpdump are rebuilt by
      # ndk-build on every run, and nothing cached the compiler output before:
      # that is the bulk of the ~3.5 min "Run tests & build release" step.
      # ccache hashes sources and flags itself, so a per-run key with the
      # newest previous cache as fallback is the right pattern.
      - name: Restore / save ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --max-size=1500M
          ccache --version | head -1

      # Run unit tests and build release in a single Gradle invocation so the
      # daemon + dependency resolution + Kotlin compile phases are shared
      # (one gradle startup instead of two), and ccache accelerates the
      # repeated ndk-build of the large webserver.c / mongoose / openssl.
      - name: Compress oversized block images (assets -> webp)
        run: |
          # Only install when Pillow is really missing (saves ~10 s per run).
          python3 -c "import PIL" 2>/dev/null \
            || pip3 install pillow -q --break-system-packages

          python3 - <<'PYEOF'

          import glob, os

          from PIL import Image

          for p in glob.glob('app/src/main/assets/img_*'):

              if p.endswith('.webp'):

                  continue

              name = os.path.basename(p)

              base = name.rsplit('.', 1)[0]

              im = Image.open(p).convert('RGB')

              w, h = im.size

              scale = min(1.0, 800 / max(w, h))

              if scale < 1.0:

                  im = im.resize((int(w * scale), int(h * scale)), Image.LANCZOS)

              out = f'app/src/main/assets/{base}.webp'

              im.save(out, 'WEBP', quality=95, method=6)

              os.remove(p)

              print(f'{name} ({w}x{h}) -> {os.path.basename(out)} ({os.path.getsize(out)//1024}KB)')

          print('block images compressed')

          PYEOF


      - name: Run tests & build release
        run: |
          # Shared versionCode epoch for stable and in-place preview workflows.
          # Both channels must advance past previously installed version codes.
          VERSION_CODE=$(($(date -u +%s) - 1577836800))
          VERSION_NAME="6.7.5.${{ github.run_number }}"
          echo "Building $VERSION_NAME (versionCode $VERSION_CODE)"
          echo "$VERSION_NAME|$VERSION_CODE" > version.txt
          ./gradlew test assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Reject placeholder or wrong-variant server in final APK
        run: python3 tools/verify_webserver_apk.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --executable webserver/build/generated/webserverJniLibs/release/arm64-v8a/libwebserver_exec.so

      # Keep the native-build cache honest: without the hit rate the ccache
      # cache above cannot be told apart from dead weight in CI timing.
      - name: ccache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Sign release APK with release key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Locate apksigner robustly: prefer ANDROID_HOME, fall back to
          # ANDROID_SDK_ROOT, and use the highest available build-tools.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK_ROOT/build-tools"/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            echo "::error::No Android build-tools found under $SDK_ROOT"
            exit 1
          fi
          # Locate the unsigned APK. NOTE: must match the exact filename, NOT
          # "! -name '*signed*'" -- "unsigned" contains the substring "signed",
          # so that exclusion wrongly dropped app-release-unsigned.apk and
          # made this step fail with "No unsigned release APK found".
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release-unsigned.apk' | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No unsigned release APK found"
            find app/build/outputs/apk/release -maxdepth 1 -type f
            exit 1
          fi
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$UNSIGNED_APK"

      # Best-effort cleanup: delete all artifacts except the newest before
      # uploading, so the repo never accumulates 100+ APK artifacts again.
      # NOTE: GitHub recalculates artifact storage usage every 6-12h, so a
      # freshly-cleaned repo may still see "quota has been hit" until then.
      - name: Clean old artifacts (keep newest 1)
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          HDR="Authorization: Bearer ${{ github.token }}"
          IDS=$(curl -s -H "$HDR" "$API?per_page=100" | python3 -c "
          import sys, json
          try:
              arts = json.load(sys.stdin).get('artifacts', [])
          except Exception:
              arts = []
          arts.sort(key=lambda a: a['created_at'], reverse=True)
          for a in arts[1:]:
              print(a['id'])
          ")
          for id in $IDS; do
            curl -s -X DELETE -H "$HDR" "$API/$id" || true
          done
          echo "cleaned old artifact ids: $IDS"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ADBlock-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            version.txt
          if-no-files-found: error
          retention-days: 1

      # NOTE: a "ci-<run_number>" DRAFT release used to be created here. It was
      # removed on purpose: drafts are invisible to everybody but the owner, the
      # step swallowed its own errors (|| true) so failures never showed up, and
      # the in-app update feed step below already publishes every build publicly.
      # This repository now only gets real releases, created by the "release" job
      # for v* tags.

      # Publish the freshly built APK to the in-app update feed
      # (GitHub Releases of this repository, see UpdateModel.RELEASES_REPO).
      #
      # The feed has to be readable WITHOUT a token by the installed apps, so it
      # has to live in a public repository - this one is public, which makes the
      # built-in GITHUB_TOKEN enough: no personal access token, no secret to
      # forget, and the step can be fatal again, because if it fails the feed
      # really was not updated. (Until now the feed was wxcvm/Doh-ECH only, a
      # repository this workflow cannot write to without a PAT: without the
      # DOH_ECH_TOKEN secret every run failed, and before that fix five runs in
      # a row only warned behind continue-on-error while no device could see the
      # builds.)
      #
      # wxcvm/Doh-ECH is still mirrored when the PAT happens to be configured,
      # because builds installed before this change look only there.
      - name: Publish to the in-app update feed
        # A successful merge should only run CI; never push a prerelease
        # APK to installed users. Tags v* or explicit manual dispatch on
        # master are intentional publishing events.
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEGACY_FEED_TOKEN: ${{ secrets.DOH_ECH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION_NAME=$(cut -d'|' -f1 version.txt)
          VERSION_CODE=$(cut -d'|' -f2 version.txt)
          APK=app/build/outputs/apk/release/app-release-signed.apk
          cp "$APK" ADBlock-latest.apk
          SHORT_SHA=$(git rev-parse --short HEAD)
          printf '{"version":"%s","versionCode":%s,"changelog":"Automatic build %s from %s"}' \
            "$VERSION_NAME" "$VERSION_CODE" "$SHORT_SHA" "${{ github.repository }}" > manifest.json

          # Keep the feed tidy: drop CI releases older than the newest 5 (only
          # tags matching our build scheme, never hand made releases). Rank by
          # the build number, not by created_at: bulk-recreated CI releases
          # share one timestamp and the app ranks the feed the same way.
          prune() {
            local repo="$1" tag
            for tag in $(gh release list --repo "$repo" --limit 100 \
                           --json tagName,isDraft \
                           --jq '[.[] | select(.isDraft == false) | .tagName
                                  | select(test("^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$"))]
                                 | sort_by(split(".") | .[-1] | tonumber) | reverse
                                 | .[5:][]'); do
              gh release delete "$tag" --repo "$repo" --cleanup-tag --yes || true
            done
          }

          publish() {
            local repo="$1"
            gh release create "$VERSION_NAME" ADBlock-latest.apk manifest.json \
              --repo "$repo" --title "ADBlock $VERSION_NAME" \
              --notes "Automatic build $VERSION_NAME (versionCode $VERSION_CODE) from ${{ github.repository }}@$SHORT_SHA" \
              || gh release upload "$VERSION_NAME" ADBlock-latest.apk manifest.json --repo "$repo" --clobber
            prune "$repo"
          }

          publish "${{ github.repository }}"

          # Fixed-tag feed (android-latest): two assets with fixed names that
          # are overwritten on every build. The app reads manifest.json with a
          # plain HTTPS GET, so the 60 requests/hour limit of the anonymous
          # GitHub API cannot break the update check any more (behind a shared
          # IP the quota is usually already spent, which made every check fail
          # with HTTP 403 while the network itself was fine).
          gh release view android-latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create android-latest --repo "${{ github.repository }}" \
                 --title "ADBlock 最新版（固定标签）" \
                 --notes "固定标签：manifest.json 与 ADBlock-latest.apk 每次构建都会被覆盖。应用内更新直接读这两个文件，不经过 REST API，因此不受 60 次/小时限流影响。"
          gh release upload android-latest ADBlock-latest.apk manifest.json \
            --repo "${{ github.repository }}" --clobber

          if [ -n "${LEGACY_FEED_TOKEN:-}" ]; then
            ( export GH_TOKEN="$LEGACY_FEED_TOKEN"; publish wxcvm/Doh-ECH )
          else
            echo "::notice::DOH_ECH_TOKEN is not set - wxcvm/Doh-ECH was not mirrored. Builds from this commit on read ${{ github.repository }} itself."
          fi

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # REQUIRED for actions/download-artifact

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: ADBlock-release-signed
          path: release-assets

      - name: Prepare release assets
        run: |
          # Find the APK and version.txt regardless of nested structure
          APK_FILE=$(find release-assets -name 'app-release-signed.apk' | head -1)
          VERSION_FILE=$(find release-assets -name 'version.txt' | head -1)
          if [ -z "$APK_FILE" ] || [ -z "$VERSION_FILE" ]; then
            echo "Missing files"
            find release-assets -type f
            exit 1
          fi
          VERSION_NAME=$(cut -d'|' -f1 "$VERSION_FILE")
          VERSION_CODE=$(cut -d'|' -f2 "$VERSION_FILE")
          cp "$APK_FILE" release-assets/ADBlock-latest.apk
          printf '{"version":"%s","versionCode":%s,"changelog":"ADBlock %s (versionCode %s)"}' "$VERSION_NAME" "$VERSION_CODE" "$VERSION_NAME" "$VERSION_CODE" > release-assets/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
