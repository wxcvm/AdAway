name: Android CI

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Restore SonarCloud packages cache
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Restore CI keystore
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ci.keystore
          key: adaway-ci-keystore-v1

      - name: Create CI keystore if missing
        run: |
          if [ ! -f "$RUNNER_TEMP/ci.keystore" ]; then
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.keystore" -alias ci -keyalg RSA -keysize 2048 -validity 10000 -storepass adawayci -keypass adawayci -dname "CN=AdAway CI, OU=CI, O=CI, L=CI, S=CI, C=CN" >/dev/null 2>&1
          fi

      - name: Sign release APK with CI key
        run: |
          BT=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ci.keystore" --ks-pass pass:adawayci --key-pass pass:adawayci --out app/build/outputs/apk/release/app-release-signed.apk app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdAway-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
      
      - name: Update dependency graph
        uses: mikepenz/gradle-dependency-submission@v1.0.0 # Deprecated: need to be changed
        with:
          gradle-dependency-path: "app/build.gradle"
          gradle-build-module: ":app"
          gradle-build-configuration: "releaseCompileClasspath"

      - name: Analyze project
        continue-on-error: true # SonarCloud project belongs to upstream AdAway/AdAway; this fork has no access to it. See build.gradle sonar { } block (projectKey/organization) — point it at your own SonarCloud project + SONAR_TOKEN to make this step meaningful again.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew -Dorg.gradle.jvmargs=-XX:MaxMetaspaceSize=512m sonar
