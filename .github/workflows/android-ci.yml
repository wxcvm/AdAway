name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*' 

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Restore SonarCloud packages cache
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign release APK with release key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdAway-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk
      
      - name: Update dependency graph
        uses: mikepenz/gradle-dependency-submission@v1.0.0 # Deprecated: need to be changed
        with:
          gradle-dependency-path: "app/build.gradle"
          gradle-build-module: ":app"
          gradle-build-configuration: "releaseCompileClasspath"

      - name: Analyze project
        continue-on-error: true # SonarCloud project belongs to upstream AdAway/AdAway; this fork has no access to it. See build.gradle sonar { } block (projectKey/organization) — point it at your own SonarCloud project + SONAR_TOKEN to make this step meaningful again.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew -Dorg.gradle.jvmargs=-XX:MaxMetaspaceSize=512m sonar

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: AdAway-release-signed
          path: release-assets

      - name: Prepare release assets
        run: |
          APP_NAME=$(grep -oP 'appName = "\K[^"]+' gradle/libs.versions.toml)
          APP_CODE=$(grep -oP 'appCode = "\K[^"]+' gradle/libs.versions.toml)
          cp release-assets/app-release-signed.apk release-assets/AdAway-latest.apk
          printf '{"version":"%s","versionCode":%s,"changelog":"IPv6 web server, Mongoose 7.22, AGP9/Gradle9/OkHttp5 upgrades, crash and sync fixes, official signing"}' ${APP_NAME} ${APP_CODE} > release-assets/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
