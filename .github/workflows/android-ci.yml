name: Android CI

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Development build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Install ccache (native builds)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ccache
          echo "NDK_CCACHE=$(which ccache)" >> "$GITHUB_ENV"

      # Run unit tests and build release in a single Gradle invocation so the
      # daemon + dependency resolution + Kotlin compile phases are shared
      # (one gradle startup instead of two), and ccache accelerates the
      # repeated ndk-build of the large webserver.c / mongoose / openssl.
      - name: Run tests & build release
        run: |
          # Monotonic versionCode: use run_number (per-workflow counter) instead
          # of date +%s which can collide or regress.
          VERSION_CODE=$((100000 + ${{ github.run_number }}))
          VERSION_NAME="6.5.0.${{ github.run_number }}"
          echo "Building $VERSION_NAME (versionCode $VERSION_CODE)"
          echo "$VERSION_NAME|$VERSION_CODE" > version.txt
          ./gradlew test assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME

      - name: Sign release APK with release key
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Locate apksigner robustly: prefer ANDROID_HOME, fall back to
          # ANDROID_SDK_ROOT, and use the highest available build-tools.
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK_ROOT/build-tools"/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ]; then
            echo "::error::No Android build-tools found under $SDK_ROOT"
            exit 1
          fi
          # Locate the unsigned APK. NOTE: must match the exact filename, NOT
          # "! -name '*signed*'" -- "unsigned" contains the substring "signed",
          # so that exclusion wrongly dropped app-release-unsigned.apk and
          # made this step fail with "No unsigned release APK found".
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 1 -name 'app-release-unsigned.apk' | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "::error::No unsigned release APK found"
            find app/build/outputs/apk/release -maxdepth 1 -type f
            exit 1
          fi
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --key-pass "pass:${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            "$UNSIGNED_APK"

      # Best-effort cleanup: delete all artifacts except the newest before
      # uploading, so the repo never accumulates 100+ APK artifacts again.
      # NOTE: GitHub recalculates artifact storage usage every 6-12h, so a
      # freshly-cleaned repo may still see "quota has been hit" until then.
      - name: Clean old artifacts (keep newest 1)
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/actions/artifacts"
          HDR="Authorization: Bearer ${{ github.token }}"
          IDS=$(curl -s -H "$HDR" "$API?per_page=100" | python3 -c "
          import sys, json
          try:
          arts = json.load(sys.stdin).get('artifacts', [])
          except Exception:
          arts = []
          arts.sort(key=lambda a: a['created_at'], reverse=True)
          for a in arts[1:]:
          print(a['id'])
          ")
          for id in $IDS; do
            curl -s -X DELETE -H "$HDR" "$API/$id" || true
          done
          echo "cleaned old artifact ids: $IDS"

      # continue-on-error: the platform-side storage quota is recalculated
      # every 6-12h; until then a fresh repo may still be rejected. Keep the
      # artifact upload as best-effort so a transient quota rejection does not
      # fail the whole pipeline.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ADBlock-release-signed
          path: |
            app/build/outputs/apk/release/*.apk
            version.txt
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read   # REQUIRED for actions/download-artifact

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: ADBlock-release-signed
          path: release-assets

      - name: Prepare release assets
        run: |
          # Find the APK and version.txt regardless of nested structure
          APK_FILE=$(find release-assets -name 'app-release-signed.apk' | head -1)
          VERSION_FILE=$(find release-assets -name 'version.txt' | head -1)
          if [ -z "$APK_FILE" ] || [ -z "$VERSION_FILE" ]; then
            echo "Missing files"
            find release-assets -type f
            exit 1
          fi
          VERSION_NAME=$(cut -d'|' -f1 "$VERSION_FILE")
          VERSION_CODE=$(cut -d'|' -f2 "$VERSION_FILE")
          cp "$APK_FILE" release-assets/ADBlock-latest.apk
          printf '{"version":"%s","versionCode":%s,"changelog":"New Material 3 UI, per-app stats, ADBlock branding, dynamic versioning, captive portal fix"}' "$VERSION_NAME" "$VERSION_CODE" > release-assets/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}