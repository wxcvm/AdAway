name: Indexed wildcard rule performance regressions

on:
  pull_request:
    branches: [feat/progress-preview-release, master]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/RuleSnapshotRepository.java'
      - 'app/src/main/java/org/adaway/model/traffic/WildcardRuleIndex.java'
      - 'app/src/test/java/org/adaway/model/traffic/WildcardRuleIndexTest.java'
      - '.github/workflows/wildcard-index-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wildcard-index-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-match-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify 5k legacy differential cases and bounded 100k-rule lookup
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests org.adaway.model.traffic.WildcardRuleIndexTest \
            --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
