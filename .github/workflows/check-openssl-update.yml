name: Check OpenSSL Prefab Updates

# The webserver module uses the OpenSSL Prefab package
# (com.android.ndk.thirdparty:openssl) distributed via Google Maven.
# This workflow checks for new releases of that artifact.

on:
  schedule:
    - cron: "0 4 * * 1"  # Every Monday at 04:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check-openssl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current OpenSSL version
        id: current
        run: |
          VERSION=$(grep -oP 'openssl\s*=\s*"\K[^"]+' gradle/libs.versions.toml)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Current OpenSSL Prefab version: ${VERSION}"

      - name: Fetch latest OpenSSL Prefab version from Google Maven
        id: upstream
        run: |
          # Query Google Maven metadata for the OpenSSL Prefab artifact
          METADATA=$(curl -s "https://dl.google.com/dl/android/maven2/com/android/ndk/thirdparty/openssl/maven-metadata.xml")
          LATEST=$(echo "$METADATA" | grep -oP '<release>\K[^<]+' || echo "unknown")
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest OpenSSL Prefab version: ${LATEST}"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          UPSTREAM="${{ steps.upstream.outputs.version }}"

          # Strip beta/alpha suffixes for version comparison
          CURRENT_CLEAN=$(echo "$CURRENT" | sed 's/-.*//')
          UPSTREAM_CLEAN=$(echo "$UPSTREAM" | sed 's/-.*//')
          HIGHEST=$(printf "%s\n%s" "$CURRENT_CLEAN" "$UPSTREAM_CLEAN" | sort -V | tail -1)

          if [ "$HIGHEST" != "$CURRENT_CLEAN" ]; then
            echo "OpenSSL update available: ${CURRENT} → ${UPSTREAM}"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "OpenSSL is up to date (${CURRENT})"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Open issue for OpenSSL update
        if: steps.compare.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.current.outputs.version }}';
            const upstream = '${{ steps.upstream.outputs.version }}';

            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies,openssl',
              per_page: 10,
            });

            const alreadyReported = existingIssues.some(issue =>
              issue.title.includes(`OpenSSL Prefab ${upstream}`)
            );

            if (alreadyReported) {
              console.log('Issue already exists, skipping.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(deps): OpenSSL Prefab ${upstream} is available (current: ${current})`,
              body: [
                `OpenSSL Prefab [${upstream}](https://maven.google.com/web/index.html#com.android.ndk.thirdparty:openssl) is available.`,
                '',
                `The currently pinned version is **${current}** in \`gradle/libs.versions.toml\`.`,
                '',
                '### What to do',
                '1. Update `openssl = "<new-version>"` in `gradle/libs.versions.toml`',
                '2. Rebuild the webserver module and verify TLS functionality',
                '3. Test CA generation and SNI certificate issuance',
                '',
                '> This issue was automatically created by the Check OpenSSL Prefab Updates workflow.',
              ].join('\n'),
              labels: ['dependencies', 'openssl', 'automated'],
            });
