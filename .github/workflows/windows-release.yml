name: Windows 11 webserver release

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master, feat/win11-webserver-release ]
    paths:
      - 'webserver/**'
      - 'app/src/main/assets/**'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Single source of truth for the release tag: the installer attach step
      # used to hardcode the tag, so every version bump uploaded the new
      # installer onto the PREVIOUS release and the new one shipped zip-only.
      TAG: win11-webserver-v1.38
    steps:
      - uses: actions/checkout@v6

      - name: Set up MSYS2 (mingw64 + OpenSSL)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # update: true runs a full "pacman -Syu" and cost 56 s per run; the
          # action's cache (on by default) already carries the toolchain, and
          # the packages below are installed with --needed. Flip this back to
          # true if a run ever fails on a stale package database.
          update: false
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-pkg-config

      - name: Assert version consistency (header / installer / TAG)
        shell: bash
        run: |
          HDR_VER=$(sed -n 's/.*#define ADBLOCK_APP_VERSION "\([^"]*\)".*/\1/p' webserver/win32/gui_win32.h | head -1)
          ISS_VER=$(sed -n 's/^AppVersion=\(.*\)$/\1/p' webserver/win32/installer.iss | head -1)
          TAG_VER="${TAG#win11-webserver-v}"
          echo "gui_win32.h=$HDR_VER installer.iss=$ISS_VER TAG=$TAG"
          if [ -z "$HDR_VER" ] || [ "$HDR_VER" != "$ISS_VER" ] || [ "$HDR_VER" != "$TAG_VER" ]; then
            echo "::error::version mismatch (header=$HDR_VER installer=$ISS_VER tag=$TAG_VER)"; exit 1
          fi

      - name: Prepare resources (convert block placeholder images to webp)
        shell: bash
        run: |
          # Only install when Pillow is really missing: this step used to pay
          # ~10 s of pip resolution on every run.
          python3 -c "import PIL" 2>/dev/null \
            || python3 -m pip install --quiet pillow \
            || pip3 install --quiet pillow
          python3 - <<'PYEOF'
          import glob, os
          from PIL import Image
          for p in glob.glob('app/src/main/assets/img_*'):
              if p.endswith('.webp'):
                  continue
              name = os.path.basename(p)
              base = name.rsplit('.', 1)[0]
              im = Image.open(p).convert('RGB')
              w, h = im.size
              scale = min(1.0, 800 / max(w, h))
              if scale < 1.0:
                  im = im.resize((int(w * scale), int(h * scale)), Image.LANCZOS)
              out = f'app/src/main/assets/{base}.webp'
              im.save(out, 'WEBP', quality=95, method=6)
              os.remove(p)
              print(f'{name} ({w}x{h}) -> {out}')
          print('block images converted')
          PYEOF
          mkdir -p resources
          cp app/src/main/assets/img_*.webp resources/ || true
          cp app/src/main/assets/test.html resources/
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          img = Image.new('RGB', (300, 120), (25, 118, 210))
          d = ImageDraw.Draw(img)
          d.rectangle([8, 8, 292, 112], outline='white', width=4)
          d.text((36, 48), 'ADBlock', fill='white')
          img.save('resources/icon.png')
          PYEOF
          # Multi-size application icon embedded into webserver.exe (windres).
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          S = 256
          img = Image.new('RGBA', (S, S), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([8, 8, S - 8, S - 8], radius=54, fill=(37, 99, 235, 255))
          d.ellipse([56, 56, S - 56, S - 56], outline=(255, 255, 255, 255), width=22)
          d.line([82, 174, 174, 82], fill=(255, 255, 255, 255), width=22)
          img.save('webserver/win32/app.ico',
                   sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          print('webserver/win32/app.ico written')
          PYEOF
          echo "resources:" && ls -la resources

      - name: Build webserver.exe (mingw64 + OpenSSL)
        shell: msys2 {0}
        run: |
          chmod +x webserver/win32/build.sh
          ./webserver/win32/build.sh
          cp -r resources webserver/win32/dist/resources
          cp webserver/win32/README.txt webserver/win32/dist/README.txt
          cp webserver/win32/start.bat webserver/win32/dist/start.bat

      - name: Smoke test (start server, fetch stats + test page)
        shell: pwsh
        run: |
          $res = (Resolve-Path "webserver\win32\dist\resources").Path
          $proc = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--resources",$res,"--http-port","18080","--https-port","18443","--no-gui") -PassThru -WorkingDirectory "webserver\win32\dist" -RedirectStandardOutput "server.log" -RedirectStandardError "server.err"
          # Poll for the first answer instead of sleeping a fixed 7 s: the
          # server binds in well under a second, so the old wait was dead time
          # (and still failed on a slow runner).
          $stats = $null
          $deadline = (Get-Date).AddSeconds(25)
          while (-not $stats -and (Get-Date) -lt $deadline) {
            if ($proc.HasExited) {
              Write-Output ("SERVER EXITED with code " + $proc.ExitCode)
              Write-Output "---- stdout tail ----"
              Get-Content "server.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Write-Output "---- stderr tail ----"
              Get-Content "server.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "webserver exited before smoke test"
            }
            try {
              $stats = Invoke-WebRequest -Uri "http://127.0.0.1:18080/internal-stats" -UseBasicParsing -TimeoutSec 5
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          if (-not $stats) { throw "no answer on http://127.0.0.1:18080/internal-stats within 25s" }
          try {
            Write-Output "internal-stats HTTP $($stats.StatusCode): $($stats.Content.Substring(0, [Math]::Min(180, $stats.Content.Length)))"
            $test = Invoke-WebRequest -Uri "http://127.0.0.1:18080/internal-test" -UseBasicParsing -TimeoutSec 10
            Write-Output "internal-test HTTP $($test.StatusCode)"
            if (-not (Test-Path "webserver\win32\dist\resources\localhost-2410.crt")) { throw "CA certificate not generated" }
            $https = Invoke-WebRequest -Uri "https://127.0.0.1:18443/internal-test" -SkipCertificateCheck -UseBasicParsing -TimeoutSec 10
            Write-Output "https internal-test HTTP $($https.StatusCode)"
            if ($stats.StatusCode -ne 200 -or $test.StatusCode -ne 200 -or $https.StatusCode -ne 200) { throw "smoke test failed" }
            # v1.11: /internal-stats must carry the listener table so the
            # dashboard can show which sockets are really bound.
            $json = $stats.Content
            if ($json -notmatch '"listeners"\s*:\s*\[') { throw "internal-stats has no listeners[] array" }
            if ($json -notmatch '"bind_ok"\s*:\s*true') { throw "internal-stats reports bind_ok=false" }
            if ($json -notmatch '"stats_port"\s*:\s*8686') { throw "internal-stats has no stats_port" }
            $mgmt = Invoke-WebRequest -Uri "http://127.0.0.1:8686/internal-stats" -UseBasicParsing -TimeoutSec 10
            Write-Output ("management port /internal-stats HTTP " + $mgmt.StatusCode)
            if ($mgmt.StatusCode -ne 200) { throw "management port not reachable" }
            # v1.29 per-app attribution: /internal-* traffic is excluded from the
            # counters by design, so send one normal request first. The client is
            # this PowerShell process, so its name must resolve to an .exe and the
            # request must show up in apps[].
            $null = Invoke-WebRequest -Uri "http://127.0.0.1:18080/ci-probe" -UseBasicParsing -TimeoutSec 10
            $json2 = (Invoke-WebRequest -Uri "http://127.0.0.1:18080/internal-stats" -UseBasicParsing -TimeoutSec 10).Content
            if ($json2 -notmatch '"apps":\[\{') { throw "internal-stats apps[] is empty" }
            if ($json2 -notmatch '"name":"[^"]*\.exe","connections":\d+,"requests":[1-9]') {
              throw "apps[] has no process-attributed request (per-app attribution broken)"
            }
            if ($json2 -notmatch '"query_log":\[') { throw "internal-stats has no query_log[] array" }
            Write-Output ("per-app attribution OK: " + ([regex]::Match($json2, '"apps":\[\{[^}]*\}')).Value)
          } catch {
            Write-Output "SMOKE TEST ERROR: $($_.Exception.Message)"
            Write-Output "---- stdout tail ----"
            Get-Content "server.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Write-Output "---- stderr tail ----"
            Get-Content "server.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          # Phase 2 - double-click simulation: no --resources (defaults to
          # the "resources" folder next to the exe, auto-created), only
          # explicit free ports so the test never collides with the first one.
          $p2 = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--http-port","18081","--https-port","18444","--no-gui") -PassThru -WorkingDirectory "webserver\win32\dist" -RedirectStandardOutput "server2.log" -RedirectStandardError "server2.err"
          $s2 = $null
          $deadline2 = (Get-Date).AddSeconds(25)
          while (-not $s2 -and (Get-Date) -lt $deadline2) {
            if ($p2.HasExited) {
              Write-Output ("NO-ARGS SERVER EXITED with code " + $p2.ExitCode)
              Get-Content "server2.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Get-Content "server2.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "no-args webserver exited"
            }
            try {
              $s2 = Invoke-WebRequest -Uri "http://127.0.0.1:18081/internal-stats" -UseBasicParsing -TimeoutSec 5
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            if (-not $s2) { throw "no-args server never answered on 18081" }
            Write-Output ("no-args mode internal-stats HTTP " + $s2.StatusCode)
            if ($s2.StatusCode -ne 200) { throw "no-args smoke test failed" }
          } catch {
            Write-Output ("NO-ARGS SMOKE TEST ERROR: " + $_.Exception.Message)
            Get-Content "server2.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content "server2.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: GUI mode smoke test (process must stay alive, not die silently)
        shell: pwsh
        run: |
          $res3 = (Resolve-Path "webserver\win32\dist\resources").Path
          $p3 = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--resources",$res3,"--http-port","18083","--https-port","18446") -PassThru -WorkingDirectory "webserver\win32\dist" -RedirectStandardOutput "server3.log" -RedirectStandardError "server3.err"
          # Wait for the GUI process to serve its main port, then make sure it
          # is still alive a moment later: proves the dashboard thread and the
          # server thread coexist, without the old fixed 8 s wait.
          $alive = $null
          $deadline3 = (Get-Date).AddSeconds(25)
          while (-not $alive -and (Get-Date) -lt $deadline3) {
            if ($p3.HasExited) {
              Write-Output ("GUI SERVER EXITED with code " + $p3.ExitCode)
              Get-Content "server3.log" -ErrorAction SilentlyContinue | Select-Object -Last 25
              Get-Content "server3.err" -ErrorAction SilentlyContinue | Select-Object -Last 25
              throw "gui-mode server exited"
            }
            try {
              $alive = Invoke-WebRequest -Uri "http://127.0.0.1:18083/internal-stats" -UseBasicParsing -TimeoutSec 5
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            if (-not $alive) { throw "gui-mode server never answered on 18083" }
            Start-Sleep -Seconds 2
            $p3.Refresh()
            if ($p3.HasExited) { throw "gui-mode server died after serving its first request" }
            Write-Output "gui-mode process alive and serving 18083 OK"
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Port-conflict test (management port must survive a busy main port)
        shell: pwsh
        run: |
          $res4 = (Resolve-Path "webserver\win32\dist\resources").Path
          # Occupy 18084 so the server cannot bind its main HTTP port.
          $blocker = Start-Job -ScriptBlock {
            $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18084)
            $l.Start()
            Start-Sleep -Seconds 90
          }
          # Wait until the blocker really listens (the job needs a moment to
          # start) instead of a flat 5 s.
          $blocked = $false
          $deadlineB = (Get-Date).AddSeconds(15)
          while (-not $blocked -and (Get-Date) -lt $deadlineB) {
            try {
              $probe = [System.Net.Sockets.TcpClient]::new()
              $probe.Connect("127.0.0.1", 18084)
              $probe.Close()
              $blocked = $true
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          if (-not $blocked) { throw "port 18084 was never taken by the blocker job" }
          # GUI mode on purpose: the dashboard must stay alive and keep the
          # loopback management port serving even when the main port is taken
          # (headless --no-gui exits fast instead, which is checked at the end).
          $p4 = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--resources",$res4,"--http-port","18084","--https-port","18447") -PassThru -WorkingDirectory "webserver\win32\dist" -RedirectStandardOutput "server4.log" -RedirectStandardError "server4.err"
          # The dashboard must come up with bind_ok=false; poll for that state
          # instead of sleeping 12 s and hoping.
          $s4 = $null
          $deadline4 = (Get-Date).AddSeconds(25)
          while (-not $s4 -and (Get-Date) -lt $deadline4) {
            if ($p4.HasExited) {
              Get-Content "server4.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
              Get-Content "server4.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
              throw "dashboard exited instead of surviving the busy main port"
            }
            try {
              $probe4 = Invoke-WebRequest -Uri "http://127.0.0.1:8686/internal-stats" -UseBasicParsing -TimeoutSec 5
              if ($probe4.StatusCode -eq 200 -and $probe4.Content -match '"bind_ok"\s*:\s*false') {
                $s4 = $probe4
              } else {
                Start-Sleep -Milliseconds 250
              }
            } catch {
              Start-Sleep -Milliseconds 250
            }
          }
          try {
            if (-not $s4) { throw "management port never reported bind_ok=false on a busy main port" }
            Write-Output ("busy-main-port: management /internal-stats HTTP " + $s4.StatusCode)
            if ($s4.StatusCode -ne 200) { throw "management port is dead while the main port is busy" }
            if ($s4.Content -notmatch '"bind_ok"\s*:\s*false') { throw "expected bind_ok=false when the main HTTP port is taken" }
            if ($s4.Content -notmatch '"bound"\s*:\s*false') { throw "expected a listener entry with bound=false" }
            $err4 = Get-Content "server4.err" -ErrorAction SilentlyContinue | Out-String
            if ($err4 -notmatch 'already in use') { throw "the conflict was not reported in webserver.log/stderr" }
            Write-Output "port-conflict handling OK (dashboard alive, bind_ok=false, warning logged)"
          } catch {
            Write-Output ("PORT CONFLICT TEST ERROR: " + $_.Exception.Message)
            Get-Content "server4.log" -ErrorAction SilentlyContinue | Select-Object -Last 30
            Get-Content "server4.err" -ErrorAction SilentlyContinue | Select-Object -Last 30
            throw
          } finally {
            Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Stop-Job $blocker -ErrorAction SilentlyContinue
            Remove-Job $blocker -Force -ErrorAction SilentlyContinue
          }
          # Wait until the loopback management port is really free again: a
          # lingering listener would make the headless instance below take the
          # "another instance is already running" path and exit 0, which would
          # hide a real bind failure.
          $released = $false
          $deadlineR = (Get-Date).AddSeconds(10)
          while (-not $released -and (Get-Date) -lt $deadlineR) {
            try {
              $probeR = [System.Net.Sockets.TcpClient]::new()
              $probeR.Connect("127.0.0.1", 8686)
              $probeR.Close()
              Start-Sleep -Milliseconds 200
            } catch {
              $released = $true
            }
          }
          if (-not $released) { throw "the management port 8686 stayed busy after stopping the dashboard" }
          # Headless mode is expected to fail fast when the port is taken
          # (a scheduled task should report the problem instead of idling).
          #
          # NOTE: the blocker above was already stopped by the finally block and
          # 18084 is free again, so this check needs its OWN busy port. Without
          # it the server binds normally, keeps running, and "it exited" can
          # only be asserted by killing it first - which is what the original
          # test did, making the assertion pass no matter what.
          $blocker2 = Start-Job -ScriptBlock {
            $l = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 18085)
            $l.Start()
            Start-Sleep -Seconds 90
          }
          $blocked2 = $false
          $deadlineB2 = (Get-Date).AddSeconds(15)
          while (-not $blocked2 -and (Get-Date) -lt $deadlineB2) {
            try {
              $probe2 = [System.Net.Sockets.TcpClient]::new()
              $probe2.Connect("127.0.0.1", 18085)
              $probe2.Close()
              $blocked2 = $true
            } catch {
              Start-Sleep -Milliseconds 200
            }
          }
          if (-not $blocked2) { throw "port 18085 was never taken by the second blocker job" }
          $sw5 = [System.Diagnostics.Stopwatch]::StartNew()
          $p5 = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--resources",$res4,"--http-port","18085","--https-port","18448","--no-gui") -PassThru -WorkingDirectory "webserver\win32\dist" -RedirectStandardOutput "server5.log" -RedirectStandardError "server5.err"
          $exitedByItself = $p5.WaitForExit(20000)
          $sw5.Stop()
          Get-Process -Name webserver -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Stop-Job $blocker2 -ErrorAction SilentlyContinue
          Remove-Job $blocker2 -Force -ErrorAction SilentlyContinue
          # Assert it left on its own: Stop-Process above would otherwise make
          # HasExited true and the check would pass no matter what.
          if (-not $exitedByItself) { throw "headless mode did not exit within 20s when the main port was taken" }
          Write-Output ("headless mode exited by itself after {0:N1}s with code {1}" -f $sw5.Elapsed.TotalSeconds, $p5.ExitCode)

      - name: Autostart registry test
        shell: pwsh
        run: |
          $res2 = (Resolve-Path "webserver\win32\dist\resources").Path
          $pI = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--resources",$res2,"--http-port","18082","--https-port","18445","--no-gui","--install-autostart") -Wait -PassThru
          if ($pI.ExitCode -ne 0) { throw "install-autostart exited with code $($pI.ExitCode)" }
          $exists1 = $false
          try { $null = Get-ItemPropertyValue -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "ADBlockWebServer" -ErrorAction Stop; $exists1 = $true } catch { $exists1 = $false }
          if (-not $exists1) { throw "autostart key not found after install" }
          $run = Get-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "ADBlockWebServer" -ErrorAction SilentlyContinue
          Write-Output ("autostart installed: " + $run.ADBlockWebServer)
          if ($run.ADBlockWebServer -notmatch '--minimized') { throw "autostart command lacks --minimized (window would never show)" }
          if ($run.ADBlockWebServer -notmatch '--stats-port') { throw "autostart command lacks --stats-port" }
          $pU = Start-Process -FilePath "webserver\win32\dist\webserver.exe" -ArgumentList @("--resources",$res2,"--http-port","18082","--https-port","18445","--no-gui","--uninstall-autostart") -Wait -PassThru
          if ($pU.ExitCode -ne 0) { throw "uninstall-autostart exited with code $($pU.ExitCode)" }
          $exists2 = $false
          try { $null = Get-ItemPropertyValue -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "ADBlockWebServer" -ErrorAction Stop; $exists2 = $true } catch { $exists2 = $false }
          if ($exists2) { throw "autostart key still present after uninstall" }
          Write-Output "autostart uninstalled OK"

      - name: Code-sign webserver.exe (when signing secrets are configured)
        shell: msys2 {0}
        env:
          SIGN_CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_B64 }}
          SIGN_CERT_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGN_CERT_B64" ]; then
            echo "no signing certificate configured - skipping sign"
            exit 0
          fi
          pacman -S --noconfirm --needed mingw-w64-x86_64-osslsigncode
          echo "$SIGN_CERT_B64" | base64 -d > "$RUNNER_TEMP/cert.pfx"
          osslsigncode sign -pkcs12 "$RUNNER_TEMP/cert.pfx" -pass "$SIGN_CERT_PASS" -h sha256 \
            -n "ADBlock Web Server" -i "https://github.com/wxcvm/AdAway" \
            -in webserver/win32/dist/webserver.exe -out webserver/win32/dist/webserver.signed.exe
          mv webserver/win32/dist/webserver.signed.exe webserver/win32/dist/webserver.exe
          osslsigncode verify webserver/win32/dist/webserver.exe && echo "signed OK"

      - name: Package zip
        shell: bash
        run: |
          cd webserver/win32/dist
          # SECURITY (audit REL-1): the smoke tests above generated a CA key and
          # runtime state inside dist\resources. Shipping those would give every
          # user the SAME publicly downloadable CA private key (silent MITM for
          # anyone who trusts it), so they are removed and their absence asserted
          # before packaging.
          rm -f webserver/win32/dist/resources/localhost-2410.key \
                webserver/win32/dist/resources/localhost-2410.crt \
                webserver/win32/dist/resources/*.dat \
                webserver/win32/dist/resources/update_cache.json \
                webserver/win32/dist/resources/allowlist.txt \
                webserver/win32/dist/resources/blocklist.txt \
                webserver/win32/dist/resources/cosmetic.css \
                webserver/win32/dist/webserver.log webserver/win32/dist/webserver.log.1 \
                webserver/win32/dist/crash.log webserver/win32/dist/resources/crash.log
          if ls webserver/win32/dist/resources/localhost-2410.key webserver/win32/dist/resources/*.dat \
                webserver/win32/dist/resources/update_cache.json 2>/dev/null | grep -q .; then
            echo "::error::release package still contains CA key or runtime state"; exit 1
          fi
          powershell -NoProfile -Command "Compress-Archive -Path .\* -DestinationPath '$GITHUB_WORKSPACE\adblock-webserver-win64.zip' -Force"
          ls -la "$GITHUB_WORKSPACE/adblock-webserver-win64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adblock-webserver-win64
          path: adblock-webserver-win64.zip
          if-no-files-found: error

      # Publishing is push/dispatch only: a pull_request run must never create
      # or overwrite a public release.
      - name: Publish GitHub Release (Windows zip)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          : "${TAG:?TAG env var missing}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" adblock-webserver-win64.zip --repo "${{ github.repository }}" --clobber || true
            echo "uploaded to existing release"
          else
            gh release create "$TAG" adblock-webserver-win64.zip --repo "${{ github.repository }}" \
              --title "ADBlock Web Server - Windows 11 (x64)" \
              --notes "ADBlock Web Server for Windows 11 (x64)：托盘常驻 + 开机自启、CA 一键信任、系统代理式拦截（拦截模式填 127.0.0.1 / 0.0.0.0，可配合 AdGuard）、劫持过滤（全流量 + HTTPS MITM + 类 AdGuard 规则）、应用内自动更新（SHA-256 校验 + API 兜底下载）、统计与诊断导出。统计口径修正：管理流量不再计入连接/请求，拦截率与拦截量一致。" || true
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # The in-app updater checks the PUBLIC feed repository (this one is
      # private, so its release API cannot be read without a token).
      # Skipped silently when DOH_ECH_TOKEN is not configured.
      - name: Publish zip to the public update feed (wxcvm/Doh-ECH)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          FEED_TOKEN: ${{ secrets.DOH_ECH_TOKEN }}
        run: |
          if [ -z "$FEED_TOKEN" ]; then
            echo "DOH_ECH_TOKEN is not configured - skipping public feed publish."
            exit 0
          fi
          : "${TAG:?TAG env var missing}"
          ZIP=$(find . -name 'adblock-webserver-win64.zip' | head -1)
          if [ -z "$ZIP" ]; then echo "no zip found"; exit 0; fi
          export GH_TOKEN="$FEED_TOKEN"
          VERSION="${TAG#win11-webserver-v}"
          gh release create "$TAG" "$ZIP" --repo wxcvm/Doh-ECH \
            --title "ADBlock Windows 服务器 v$VERSION" \
            --notes "Windows 端一键更新版（自动检查/下载/替换/重启）" \
            || gh release upload "$TAG" "$ZIP" --repo wxcvm/Doh-ECH --clobber

      - name: Build installer (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" webserver/win32/installer.iss
          Get-ChildItem webserver/win32/dist-installer

      - name: Attach installer to the release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = "webserver/win32/dist-installer/adblock-webserver-setup.exe"
          if (-not (Test-Path $exe)) { Write-Host "installer not built - skipped"; exit 0 }
          if (-not $env:TAG) { Write-Error "TAG env var missing"; exit 1 }
          gh release upload "$env:TAG" $exe --repo "${{ github.repository }}" --clobber
          Write-Host "attached $exe to $env:TAG"

      # The in-app updater reads this fixed-tag manifest instead of the REST API
      # (60 requests/hour per IP) - see UPDATE_MANIFEST_PATH in update_win32.c.
      - name: Publish windows-manifest.json (fixed tag win11-latest)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXE=webserver/win32/dist-installer/adblock-webserver-setup.exe
          ZIP="$GITHUB_WORKSPACE/adblock-webserver-win64.zip"
          # GNU coreutils prefixes the digest line with '\' (and escapes the
          # name) when the path contains a backslash, which a Windows runner's
          # $GITHUB_WORKSPACE always does. "cut -f1" kept that marker, so the
          # published manifest carried "sha256:\<hex>" - not valid JSON (strict
          # parsers reject the whole file) and not a usable digest either.
          sha_of() { sha256sum -- "$1" | awk '{print $1}' | tr -d '\\'; }
          ZIP_SHA=""
          if [ -f "$ZIP" ]; then ZIP_SHA=$(sha_of "$ZIP"); fi
          EXE_SHA=""
          if [ -f "$EXE" ]; then EXE_SHA=$(sha_of "$EXE"); fi
          if [ -z "$ZIP_SHA" ]; then
            echo "::error::portable zip missing - refusing to publish a manifest"; exit 1
          fi
          # A failed Inno build used to abort this step silently, so the fixed
          # tag kept advertising the PREVIOUS version and every client reported
          # "已是最新" while a newer build existed. Publish zip-only instead:
          # the updater falls back to the portable package.
          if [ -z "$EXE_SHA" ]; then
            echo "::warning::installer missing - publishing a zip-only manifest"
          fi
          VER="${TAG#win11-webserver-v}"
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          python3 - "$TAG" "$VER" "$BASE" "$EXE_SHA" "$ZIP_SHA" > windows-manifest.json <<'PYEOF'
          import datetime, json, sys
          tag, ver, base, exe_sha, zip_sha = sys.argv[1:6]
          doc = {
              "tag": tag,
              "version": ver,
              "exe": "adblock-webserver-setup.exe" if exe_sha else "",
              "exe_url": "%s/adblock-webserver-setup.exe" % base if exe_sha else "",
              "exe_sha256": "sha256:%s" % exe_sha if exe_sha else "",
              "zip_url": "%s/adblock-webserver-win64.zip" % base,
              "zip_sha256": "sha256:%s" % zip_sha,
              "published_at": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          json.dump(doc, sys.stdout, indent=2)
          sys.stdout.write("\n")
          PYEOF
          # Parse it with a strict JSON reader before publishing, so a corrupt
          # manifest fails the run instead of stranding every installed client.
          python3 - <<'PYEOF'
          import json
          doc = json.load(open("windows-manifest.json", encoding="utf-8"))
          assert doc["zip_sha256"].startswith("sha256:") and len(doc["zip_sha256"]) == 71, doc
          if doc["exe_sha256"]:
              assert len(doc["exe_sha256"]) == 71, doc
          print("manifest verified: version=%s zip=%s exe=%s" % (
              doc["version"], doc["zip_sha256"][:14], doc["exe_sha256"][:14] or "none"))
          PYEOF
          cat windows-manifest.json
          gh release view win11-latest --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create win11-latest --repo "${{ github.repository }}" \
                 --title "Windows 最新版（固定标签）" \
                 --notes "固定标签：windows-manifest.json 每次发布时由 CI 覆盖，应用内更新直接读它，不经过 GitHub API，因此不受 60 次/小时限流影响。"
          gh release upload win11-latest windows-manifest.json --repo "${{ github.repository }}" --clobber
