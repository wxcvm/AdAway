name: Traffic mode decision tests

on:
  pull_request:
    branches: [master, feat/dns-aaaa-diagnostics-v1, feat/dns-tcp-diagnostics-v1, feat/typed-rule-provenance-v1, feat/traffic-mode-foundation, fix/android-diagnostic-p0, feat/isolated-transport-poc, feat/rule-loader-atomic-v1]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - 'app/src/main/java/org/adaway/model/source/**'
      - 'app/src/test/java/org/adaway/model/source/**'
      - 'app/src/androidTest/java/org/adaway/model/source/**'
      - 'app/src/androidTest/java/org/adaway/model/traffic/**'
      - 'app/src/main/java/org/adaway/db/dao/HostEntryDao.java'
      - 'app/src/main/java/org/adaway/db/**'
      - 'app/schemas/**'
      - 'app/src/main/java/org/adaway/model/rules/**'
      - 'app/src/main/java/org/adaway/ui/compose/StatsViewModel.kt'
      - 'app/src/main/java/org/adaway/util/WebServerUtils.java'
      - 'app/build.gradle'
      - 'webserver/jni/**'
      - '.github/workflows/traffic-mode-tests.yml'
  push:
    branches: [feat/traffic-mode-foundation]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - '.github/workflows/traffic-mode-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  room-loader:
    name: Room transactions and IPv6 sockets (isolated emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM for the disposable test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run private Room and loopback IPv6 transport tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -PruleLoaderTestAbi=x86_64 -Pandroid.injected.build.abi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=org.adaway.model.source.SourceLoaderRoomTest,org.adaway.model.source.RuleBrowserRoomTest,org.adaway.model.traffic.DiagnosticIpv6TransportDeviceTest
      - name: Upload Room and isolated IPv6 socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-source-loader-results-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/schemas/**
          if-no-files-found: warn
  test:
    name: Pure traffic mode decision tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run traffic mode regression tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
      - name: Test actual native loader and concurrent immutable publication
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/diagnostic_dns_reply_test.c -o "$RUNNER_TEMP/dns-reply-test"
          "$RUNNER_TEMP/dns-reply-test" webserver/jni/diagnostic_dns_vectors.tsv
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/diagnostic_dns_reply_test.c -o "$RUNNER_TEMP/dns-reply-asan"
          "$RUNNER_TEMP/dns-reply-asan" webserver/jni/diagnostic_dns_vectors.tsv
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-loader-test"
          directory=$(mktemp -d)
          "$RUNNER_TEMP/domain-loader-test" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-loader-asan"
          "$RUNNER_TEMP/domain-loader-asan" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-loader-test"
          "$RUNNER_TEMP/block-loader-test"
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-loader-asan"
          "$RUNNER_TEMP/block-loader-asan"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/typed_rule_snapshot_test.c -o "$RUNNER_TEMP/typed-loader-test"
          "$RUNNER_TEMP/typed-loader-test" webserver/jni/typed_rule_vectors.tsv
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread webserver/jni/typed_rule_snapshot_test.c -o "$RUNNER_TEMP/typed-loader-asan"
          "$RUNNER_TEMP/typed-loader-asan" webserver/jni/typed_rule_vectors.tsv
      - name: Run portable shared core contract tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic webserver/jni/traffic_core_contract_test.c -o "$RUNNER_TEMP/core-contract-test"
          "$RUNNER_TEMP/core-contract-test"
      - name: Validate shared interface schema
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/core-contract-requirements.txt
          python3 tools/core_contract_schema_test.py
      - name: Build debug APK for device testing
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adblock-tun-debug
          path: |
            app/build/intermediates/apk/debug/*.apk
            app/build/intermediates/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify separate preview package and manual update behavior
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PprogressPreview=true -Pandroid.injected.build.abi=arm64-v8a
          apk=$(find app/build -path '*/apk/debug/*.apk' -type f | head -1)
          test -n "$apk"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/aapt" dump badging "$apk" > preview-identity.txt
          grep -Fq "package: name='com.wxcvm.Adaway.preview'" preview-identity.txt
          grep -Fq "native-code: 'arm64-v8a'" preview-identity.txt
          "$bt/apksigner" verify --verbose "$apk"
          mkdir -p preview-apk
          cp "$apk" preview-apk/AdAway-preview-arm64.apk
      - name: Upload isolated preview APK (CI artifact only, no public release)
        uses: actions/upload-artifact@v4
        with:
          name: adaway-isolated-preview-debug
          path: preview-apk/AdAway-preview-arm64.apk
          if-no-files-found: error
          retention-days: 7
