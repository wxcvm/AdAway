name: Traffic mode decision tests

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - '.github/workflows/traffic-mode-tests.yml'
  push:
    branches: [feat/traffic-mode-foundation]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - '.github/workflows/traffic-mode-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pure traffic mode decision tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run traffic mode regression tests
        run: ./gradlew :app:testDebugUnitTest --tests org.adaway.model.traffic.TrafficModePolicyTest --tests org.adaway.model.traffic.VpnConflictDebouncerTest --tests org.adaway.model.traffic.DiagnosticTunPlanTest --no-daemon
