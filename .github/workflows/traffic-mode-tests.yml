name: Traffic mode decision tests

on:
  pull_request:
    branches: [master, feat/traffic-mode-foundation]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - '.github/workflows/traffic-mode-tests.yml'
  push:
    branches: [feat/traffic-mode-foundation]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - '.github/workflows/traffic-mode-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pure traffic mode decision tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run traffic mode regression tests
        run: ./gradlew :app:testDebugUnitTest --tests 'org.adaway.model.traffic.*' --tests org.adaway.model.root.HijackCleanupCommandsTest --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
      - name: Build debug APK for device testing
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adblock-tun-debug
          path: |
            app/build/intermediates/apk/debug/*.apk
            app/build/intermediates/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
