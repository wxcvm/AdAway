name: Traffic mode decision tests

on:
  pull_request:
    branches: [master, feat/dns-aaaa-diagnostics-v1, feat/dns-tcp-diagnostics-v1, feat/typed-rule-provenance-v1, feat/traffic-mode-foundation, fix/android-diagnostic-p0, feat/isolated-transport-poc, feat/rule-loader-atomic-v1]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - 'app/src/test/resources/transport/**'
      - 'tools/transport-vectors.py'
      - 'app/src/test/resources/tcp/**'
      - 'tools/tcp-vectors.py'
      - 'tools/response-policy-fixture.py'
      - 'app/src/main/java/org/adaway/model/source/**'
      - 'app/src/test/java/org/adaway/model/source/**'
      - 'app/src/androidTest/java/org/adaway/model/source/**'
      - 'app/src/androidTest/java/org/adaway/model/traffic/**'
      - 'app/src/main/java/org/adaway/db/dao/HostEntryDao.java'
      - 'app/src/main/java/org/adaway/db/**'
      - 'app/schemas/**'
      - 'app/src/main/java/org/adaway/model/rules/**'
      - 'app/src/main/java/org/adaway/ui/compose/Stats*.kt'
      - 'app/src/main/java/org/adaway/util/WebServerUtils.java'
      - 'app/src/main/java/org/adaway/util/WebServerNet.java'
      - 'app/src/main/java/org/adaway/util/WebServerStats.java'
      - 'app/src/main/java/org/adaway/util/BoundedProcessResponse.java'
      - 'app/src/test/java/org/adaway/util/*ResponseTest.java'
      - 'app/src/test/java/org/adaway/util/WebServerStatsTransportTest.java'
      - 'app/src/androidTest/java/org/adaway/util/WebServerStatsDeviceTest.java'
      - 'app/src/main/java/org/adaway/util/*Listener*.java'
      - 'app/src/test/java/org/adaway/util/*Listener*.java'
      - 'app/src/main/java/org/adaway/model/root/MagiskBootScript.java'
      - 'app/src/main/java/org/adaway/broadcast/**'
      - 'app/src/test/java/org/adaway/model/root/MagiskBootScriptTest.java'
      - 'tools/test-managed-listener-emulator.sh'
      - 'app/src/main/java/org/adaway/model/update/**'
      - 'app/src/test/java/org/adaway/model/update/**'
      - 'app/build.gradle'
      - 'webserver/**'
      - 'tcpdump/**'
      - 'tools/verify_webserver_apk.py'
      - '.github/workflows/traffic-mode-tests.yml'
  push:
    branches: [feat/traffic-mode-foundation]
    paths:
      - 'app/src/main/java/org/adaway/model/traffic/**'
      - 'app/src/test/java/org/adaway/model/traffic/**'
      - '.github/workflows/traffic-mode-tests.yml'
  workflow_dispatch:

concurrency:
  group: traffic-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  room-loader:
    name: Room transactions and IPv6 sockets (isolated emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM for the disposable test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build disposable x86_64 listener diagnostic fixture
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.1.13356709'
          mkdir -p app/src/debug/jniLibs/x86_64
          "$ANDROID_HOME/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang" -std=c11 -Wall -Wextra -Werror -fPIE -pie webserver/jni/listen_address_probe.c -o app/src/debug/jniLibs/x86_64/liblistener_probe.so
          "$ANDROID_HOME/ndk/28.1.13356709/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android30-clang" -std=c11 -O2 -DMG_ENABLE_IPV6=1 -DMG_TLS=0 -DMG_ENABLE_LOG=0 -fPIE -pie webserver/jni/listener_arrival_fixture.c webserver/jni/mongoose/mongoose.c -o app/src/debug/jniLibs/x86_64/liblistener_arrival_probe.so
      - name: Run private Room and loopback IPv6 transport tests
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          script: bash tools/test-managed-listener-emulator.sh
      - name: Upload Room and isolated IPv6 socket evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-source-loader-results-api-${{ matrix.api }}
          path: |
            app/build/outputs/androidTest-results/connected/**
            app/schemas/**
          if-no-files-found: warn
  test:
    name: Pure traffic mode decision tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Test actual dual-stack placeholder and response policies
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/response-policy-fixture"
          mkdir -p "$fixture"
          python3 tools/response-policy-fixture.py --source webserver/jni/webserver.c --output "$fixture/response-policy.c"
          cc -std=c11 -O2 -D_GNU_SOURCE -DMG_TLS=0 -DMG_ENABLE_IPV6=1 -Wall -Wextra -Werror -pedantic -Iwebserver/jni -c "$fixture/response-policy.c" -o "$fixture/response-policy.o"
          cc -std=c11 -O2 -D_GNU_SOURCE -DMG_TLS=0 -DMG_ENABLE_IPV6=1 "$fixture/response-policy.o" webserver/jni/mongoose/mongoose.c -pthread -o "$fixture/response-policy"
          "$fixture/response-policy" "$fixture" 2>&1 | tee "$fixture/results.txt"
      - name: Upload response-policy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-response-policy
          path: ${{ runner.temp }}/response-policy-fixture
          if-no-files-found: warn
      - name: Run traffic mode regression tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
      - name: Test preview publication without network writes
        run: |
          python3 tools/test-preview-channel.py
          python3 tools/test-artifact-cleanup.py
      - name: Test actual native loader and concurrent immutable publication
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/lifecycle_lock_test.c -o "$RUNNER_TEMP/lifecycle-lock-test"
          "$RUNNER_TEMP/lifecycle-lock-test"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/lifecycle_lock_test.c -o "$RUNNER_TEMP/lifecycle-lock-asan"
          "$RUNNER_TEMP/lifecycle-lock-asan"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/request_host_test.c -o "$RUNNER_TEMP/request-host-test"
          "$RUNNER_TEMP/request-host-test"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/request_host_test.c -o "$RUNNER_TEMP/request-host-asan"
          "$RUNNER_TEMP/request-host-asan"
          python3 tools/verify_webserver_apk_test.py
          python3 tools/stats-json-bounds-fixture.py webserver/jni/webserver.c "$RUNNER_TEMP/stats-json-bounds.c"
          python3 tools/request-accounting-fixture.py --source webserver/jni/webserver.c --output "$RUNNER_TEMP/request-accounting.c"
          cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Iwebserver/jni -c "$RUNNER_TEMP/request-accounting.c" -o "$RUNNER_TEMP/request-accounting.o"
          cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -fsanitize=address,undefined -fno-omit-frame-pointer "$RUNNER_TEMP/request-accounting.o" webserver/jni/mongoose/mongoose.c -pthread -o "$RUNNER_TEMP/request-accounting"
          "$RUNNER_TEMP/request-accounting"
          cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer -Iwebserver/jni -c "$RUNNER_TEMP/stats-json-bounds.c" -o "$RUNNER_TEMP/stats-json-bounds.o"
          cc -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -fsanitize=address,undefined -fno-omit-frame-pointer "$RUNNER_TEMP/stats-json-bounds.o" webserver/jni/mongoose/mongoose.c -pthread -o "$RUNNER_TEMP/stats-json-bounds"
          "$RUNNER_TEMP/stats-json-bounds"
          cc -DMG_ENABLE_IPV6=1 -std=c11 -O2 -D_GNU_SOURCE -Wall -Wextra -Werror -c webserver/jni/query_log_store_test.c -o "$RUNNER_TEMP/query-log-test.o"
          cc -DMG_ENABLE_IPV6=1 -std=c11 -O2 -D_GNU_SOURCE -DMG_TLS=0 "$RUNNER_TEMP/query-log-test.o" webserver/jni/mongoose/mongoose.c -pthread -o "$RUNNER_TEMP/query-log-test"
          "$RUNNER_TEMP/query-log-test" "$RUNNER_TEMP"
          cc -DMG_ENABLE_IPV6=1 -std=c11 -O1 -g -D_GNU_SOURCE -DMG_TLS=0 -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/query_log_store_test.c webserver/jni/mongoose/mongoose.c -pthread -o "$RUNNER_TEMP/query-log-asan"
          "$RUNNER_TEMP/query-log-asan" "$RUNNER_TEMP"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/diagnostic_udp_packet_test.c -o "$RUNNER_TEMP/transport-packets"
          "$RUNNER_TEMP/transport-packets" app/src/test/resources/transport/packet_vectors.tsv
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/diagnostic_udp_packet_test.c -o "$RUNNER_TEMP/transport-packets-asan"
          "$RUNNER_TEMP/transport-packets-asan" app/src/test/resources/transport/packet_vectors.tsv
          python3 tools/tcp-vectors.py
          git diff --exit-code -- app/src/test/resources/tcp/socks5_vectors.tsv
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/diagnostic_socks5_test.c -o "$RUNNER_TEMP/tcp-contract"
          "$RUNNER_TEMP/tcp-contract" app/src/test/resources/tcp/socks5_vectors.tsv
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/diagnostic_socks5_test.c -o "$RUNNER_TEMP/tcp-contract-asan"
          "$RUNNER_TEMP/tcp-contract-asan" app/src/test/resources/tcp/socks5_vectors.tsv
          cc -std=c11 -O2 -D_GNU_SOURCE -DMG_ENABLE_IPV6=1 -DMG_IPV6_V6ONLY=1 -DMG_TLS=0 webserver/jni/listener_mongoose_test.c webserver/jni/mongoose/mongoose.c -pthread -o "$RUNNER_TEMP/listener-mongoose"
          "$RUNNER_TEMP/listener-mongoose"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/listener_pair_test.c -o "$RUNNER_TEMP/listener-pair"
          "$RUNNER_TEMP/listener-pair"
          cc -std=c11 -O1 -g -fsanitize=address,undefined webserver/jni/listener_pair_test.c -o "$RUNNER_TEMP/listener-pair-asan"
          "$RUNNER_TEMP/listener-pair-asan"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/listen_address_test.c -o "$RUNNER_TEMP/listener-test"
          "$RUNNER_TEMP/listener-test"
          cc -std=c11 -O1 -g -fsanitize=address,undefined webserver/jni/listen_address_test.c -o "$RUNNER_TEMP/listener-asan"
          "$RUNNER_TEMP/listener-asan"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic webserver/jni/diagnostic_dns_reply_test.c -o "$RUNNER_TEMP/dns-reply-test"
          "$RUNNER_TEMP/dns-reply-test" webserver/jni/diagnostic_dns_vectors.tsv
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer webserver/jni/diagnostic_dns_reply_test.c -o "$RUNNER_TEMP/dns-reply-asan"
          "$RUNNER_TEMP/dns-reply-asan" webserver/jni/diagnostic_dns_vectors.tsv
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-loader-test"
          directory=$(mktemp -d)
          "$RUNNER_TEMP/domain-loader-test" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread webserver/jni/domain_rule_snapshot_test.c -o "$RUNNER_TEMP/domain-loader-asan"
          "$RUNNER_TEMP/domain-loader-asan" webserver/jni/source_loader_vectors.txt "$directory"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-loader-test"
          "$RUNNER_TEMP/block-loader-test"
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread webserver/jni/block_rule_snapshot_test.c -o "$RUNNER_TEMP/block-loader-asan"
          "$RUNNER_TEMP/block-loader-asan"
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -pthread webserver/jni/typed_rule_snapshot_test.c -o "$RUNNER_TEMP/typed-loader-test"
          "$RUNNER_TEMP/typed-loader-test" webserver/jni/typed_rule_vectors.tsv
          cc -std=c11 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -pthread webserver/jni/typed_rule_snapshot_test.c -o "$RUNNER_TEMP/typed-loader-asan"
          "$RUNNER_TEMP/typed-loader-asan" webserver/jni/typed_rule_vectors.tsv
      - name: Run portable shared core contract tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic webserver/jni/traffic_core_contract_test.c -o "$RUNNER_TEMP/core-contract-test"
          "$RUNNER_TEMP/core-contract-test"
      - name: Validate shared interface schema
        run: |
          python3 -m pip install --disable-pip-version-check -r tools/core-contract-requirements.txt
          python3 tools/core_contract_schema_test.py
      - name: Build debug APK for device testing
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
      - name: Build and verify mixed Debug-test Release packaging regression
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --max-workers=2 -Pandroid.injected.build.abi=arm64-v8a
          python3 tools/verify_webserver_apk.py --apk-root app/build --variant release --executable webserver/build/generated/webserverJniLibs/release/arm64-v8a/libwebserver_exec.so
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adblock-tun-debug
          path: |
            app/build/intermediates/apk/debug/*.apk
            app/build/intermediates/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Verify separate preview package and manual update behavior
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PprogressPreview=true -Pandroid.injected.build.abi=arm64-v8a
          apk=$(find app/build -path '*/apk/debug/*.apk' -type f | head -1)
          test -n "$apk"
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$bt/aapt" dump badging "$apk" > preview-identity.txt
          grep -Fq "package: name='com.wxcvm.Adaway.preview'" preview-identity.txt
          grep -Fq "native-code: 'arm64-v8a'" preview-identity.txt
          "$bt/apksigner" verify --verbose "$apk"
          mkdir -p preview-apk
          cp "$apk" preview-apk/AdAway-preview-arm64.apk
      - name: Upload isolated preview APK (CI artifact only, no public release)
        uses: actions/upload-artifact@v4
        with:
          name: adaway-isolated-preview-debug
          path: preview-apk/AdAway-preview-arm64.apk
          if-no-files-found: error
          retention-days: 7
