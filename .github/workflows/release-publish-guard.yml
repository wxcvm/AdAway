name: Release feed publishing safety
on:
  push:
    branches: [ci/safe-merge-no-auto-publish-20261017]
    paths:
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release-publish-guard.yml'
      - '.github/workflows/progress-preview.yml'
      - 'tools/compress_block_images.py'
      - 'tools/test_compress_block_images.py'
      - 'tools/check_stats_contract.py'
      - 'tools/test_check_stats_contract.py'
      - 'docs/windows-core-contract.md'
      - 'webserver/jni/webserver.c'
      - 'webserver/jni/query_log_store.inc'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/android-ci.yml'
      - '.github/workflows/release-publish-guard.yml'
      - '.github/workflows/progress-preview.yml'
      - 'tools/compress_block_images.py'
      - 'tools/test_compress_block_images.py'
      - 'tools/check_stats_contract.py'
      - 'tools/test_check_stats_contract.py'
      - 'docs/windows-core-contract.md'
      - 'webserver/jni/webserver.c'
      - 'webserver/jni/query_log_store.inc'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check emitted JSON fields before merging
        run: |
          python3 tools/check_stats_contract.py
          python3 -m unittest discover -s tools -p 'test_check_stats_contract.py'
      - name: Prevent publishing on ordinary merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          data = Path('.github/workflows/android-ci.yml').read_text()
          assert "if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || startsWith(github.ref, 'refs/tags/v')" in data, 'Unconditional in-app feed update'
          assert "if: startsWith(github.ref, 'refs/tags/v')" in data, 'Missing tag-only release guard'
          assert data.count('gh release upload android-latest') == 1, 'Unexpected release feed writes'
          preview = Path('.github/workflows/progress-preview.yml').read_text()
          for required in (
              "branches: ['preview/release-*']",
              "Sign preview using SAME production Android keystore",
              "secrets.SIGNING_KEYSTORE_BASE64",
              "secrets.SIGNING_STORE_PASSWORD",
              "secrets.SIGNING_KEY_ALIAS",
              "secrets.SIGNING_KEY_PASSWORD",
              "sign --ks",
              "PREVIEW_ABIS: 'arm64-v8a x86_64 riscv64'",
              "arm64-v8a) slug=arm64; suffix='' ;;",
              'apk="release-assets/AdAway-preview-$slug.apk"',
              "tools/compare_apk_signers.py",
              "gh release download",
              'signature="release-assets/APK-SIGNATURE$suffix.txt"',
              "--prerelease --latest=false",
          ):
              assert required in preview, 'Preview signer/publish guard missing: ' + required
          assert "-PprogressPreview=true" not in preview, 'Preview must upgrade the production package'
          assert "package: name='com.wxcvm.Adaway'" in preview
          assert 'test "$PREVIEW_VERSION_CODE" -gt "$stable_code"' in preview
          assert "1577836800" in data and "1577836800" in preview
          assert "debug signing key" not in preview.lower()
          assert preview.count("      - name: Publish signed, in-place inspection prerelease") == 1, 'duplicated preview publish steps'
          assert preview.count("      - name: Sign preview using SAME production Android keystore and verify fingerprint") == 1, 'duplicated signer stage'
          assert preview.count('for abi in $PREVIEW_ABIS; do') == 2, 'ABI build and signing loops must both be present'
          assert preview.count('python3 tools/verify_webserver_apk.py --apk-root app/build --variant release --abi "$abi"') == 1, 'ABI-specific source executable validation missing'
          assert preview.count('python3 tools/verify_webserver_apk.py --apk "$apk" --variant release --abi "$abi"') == 1, 'Signed ABI-specific package validation missing'
          assert preview.count("          gh release create ") == 2, 'unexpected release publication paths'

          print('PASS: ordinary main branch merges do not publish an APK and preview must match production signing key')
          PY
      - name: Test shared stable/preview image compression
        run: |
          python3 -c "import PIL" 2>/dev/null \
            || pip3 install pillow -q --break-system-packages
          python3 -m unittest discover -s tools -p 'test_compress_block_images.py'

      - name: Test APK signer fingerprint compatibility across Build Tools versions
        run: python3 -m unittest discover -s tools -p 'test_compare_apk_signers.py'

