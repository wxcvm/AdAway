name: Compose settings refactor checks

on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/java/org/adaway/ui/compose/SettingsScreen.kt'
      - 'app/src/main/java/org/adaway/ui/compose/SettingsCategoryNavigation.kt'
      - 'app/src/main/res/values/strings_compose.xml'
      - 'app/src/main/res/values-zh/strings_compose.xml'
      - '.github/workflows/settings-ui-tests.yml'
  push:
    branches: ['ui/settings-seven-sections-*']

# Discard outdated branch builds when UI is edited repeatedly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  settings:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Validate 7 category resources in both languages
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = [
              Path("app/src/main/res/values/strings_compose.xml"),
              Path("app/src/main/res/values-zh/strings_compose.xml"),
          ]
          groups = [
              {entry.attrib["name"] for entry in ET.parse(path).getroot().iter("string")}
              for path in paths
          ]
          for i in range(1, 8):
              for suffix in ("title", "description", "keywords"):
                  key = f"compose_settings_section_{i}_{suffix}"
                  assert all(key in group for group in groups), key
          page = Path("app/src/main/java/org/adaway/ui/compose/SettingsScreen.kt").read_text()
          assert "rememberSaveable" in page and "SettingsCategoryNavigation" in page
          assert "BackHandler(enabled = selectedSection >= 0)" in page
          assert "if (selectedSection < 0)" in page
          assert "sectionSearchHints" in page
          assert "else sectionTitles[selectedSection]" in page
          assert "selectedSection = -1" in page
          nav = Path("app/src/main/java/org/adaway/ui/compose/SettingsCategoryNavigation.kt").read_text()
          assert "ScrollableTabRow" not in nav
          assert "LazyColumn" in nav
          assert "OutlinedTextField" in nav and "SettingsCategoryNavigation" in nav
          for i in range(7):
              assert f"{i} ->" in page, f"Missing settings page section {i}"
          print("All seven categorized settings sections present and localized")
          PY
      - name: Compile Compose settings and run debug unit tests
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2
