name: Check Mongoose Updates

# Check the vendored Mongoose library version against the upstream
# release every week. If a newer version is available, open an issue
# so the maintainer can evaluate and update.
#
# NOTE: Mongoose is dual-licensed (GPLv2 / commercial). The .c/.h
# files vendored here are from the public GPLv2 repository.

on:
  schedule:
    - cron: "0 4 * * 1"  # Every Monday at 04:00 UTC
  workflow_dispatch:      # Allow manual trigger

permissions:
  issues: write
  contents: read

jobs:
  check-mongoose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current vendored version
        id: current
        run: |
          VERSION=$(grep -oP 'MG_VERSION\s+"\K[^"]+' webserver/jni/mongoose/mongoose.h)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Current vendored Mongoose version: ${VERSION}"

      - name: Fetch latest upstream version
        id: upstream
        run: |
          # Mongoose publishes releases on GitHub
          LATEST=$(curl -s https://api.github.com/repos/cesanta/mongoose/releases/latest \
            | jq -r .tag_name | sed 's/^v//' || echo "unknown")
          echo "version=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest upstream Mongoose version: ${LATEST}"

      - name: Compare versions
        id: compare
        run: |
          CURRENT="${{ steps.current.outputs.version }}"
          UPSTREAM="${{ steps.upstream.outputs.version }}"

          # Simple semver comparison: sort by version
          HIGHEST=$(printf "%s\n%s" "$CURRENT" "$UPSTREAM" | sort -V | tail -1)

          if [ "$HIGHEST" != "$CURRENT" ]; then
            echo "Mongoose update available: ${CURRENT} → ${UPSTREAM}"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "Mongoose is up to date (${CURRENT})"
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Open issue for Mongoose update
        if: steps.compare.outputs.needs_update == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const current = '${{ steps.current.outputs.version }}';
            const upstream = '${{ steps.upstream.outputs.version }}';

            // Check if an issue already exists for this version
            const { data: existingIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies,mongoose',
              per_page: 10,
            });

            const alreadyReported = existingIssues.some(issue =>
              issue.title.includes(`Mongoose ${upstream}`)
            );

            if (alreadyReported) {
              console.log(`Issue for Mongoose ${upstream} already exists, skipping.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(deps): Mongoose ${upstream} is available (current: ${current})`,
              body: [
                `Upstream Mongoose [${upstream}](https://github.com/cesanta/mongoose/releases/tag/v${upstream}) is available.`,
                '',
                `The currently vendored version is **${current}** in \`webserver/jni/mongoose/\`.`,
                '',
                '### What to do',
                '1. Review the [upstream changelog](https://github.com/cesanta/mongoose/releases)',
                '2. Download the updated `mongoose.c` and `mongoose.h`',
                '3. Replace the vendored files in `webserver/jni/mongoose/`',
                '4. Verify the `mg_tls_openssl` struct layout matches (see `webserver.c` line ~140)',
                '5. Build and test the web server',
                '',
                '> This issue was automatically created by the Check Mongoose Updates workflow.',
              ].join('\n'),
              labels: ['dependencies', 'mongoose', 'automated'],
            });
