name: Android native ABI packages

on:
  pull_request:
    branches: [master]
    paths: ['app/**', 'webserver/**', 'tcpdump/**', 'gradle/**', '*.gradle', 'tools/verify_webserver_apk*', '.github/workflows/native-abis.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-abis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Native APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned NDK and SDK
        run: sdkmanager 'ndk;28.1.13356709'
      - name: Build full APK with actual native executables
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PnativeAbi="$ANDROID_ABI" -Pandroid.injected.build.abi="$ANDROID_ABI"
          python3 tools/verify_webserver_apk.py --variant debug --abi "$ANDROID_ABI" --executable "webserver/build/generated/webserverJniLibs/debug/$ANDROID_ABI/libwebserver_exec.so" | tee native-abi-result.txt
          printf '%s\n' "$GITHUB_SHA" > NATIVE-SOURCE-COMMIT.txt
      - name: Preserve exact ABI package and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/intermediates/apk/debug/*.apk
            native-abi-result.txt
            NATIVE-SOURCE-COMMIT.txt
            webserver/build/official-openssl/${{ matrix.abi }}/BUILD-IDENTITY
          if-no-files-found: warn
