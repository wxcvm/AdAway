name: Android native ABI packages

on:
  pull_request:
    branches: [master]
    paths: ['app/**', 'webserver/**', 'tcpdump/**', 'gradle/**', '*.gradle', 'tools/verify_webserver_apk*', '.github/workflows/native-abis.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-abis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: ABI packaging and feed contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/verify_webserver_apk_test.py
      - run: python3 -m unittest discover -s tools -p test_prepare_preview_feed.py

  package:
    name: Native APK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64, riscv64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore only this ABI's pinned OpenSSL output
        uses: actions/cache@v4
        with:
          path: webserver/build/official-openssl/${{ matrix.abi }}
          key: official-openssl-${{ matrix.abi }}-ndk28-${{ runner.os }}-${{ hashFiles('webserver/scripts/build-official-openssl.sh') }}
      - name: Install pinned NDK and SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.1.13356709"'
      - name: Build full APK with actual native executables
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --max-workers=2 -PnativeAbi="$ANDROID_ABI" -Pandroid.injected.build.abi="$ANDROID_ABI"
          python3 tools/verify_webserver_apk.py --variant debug --abi "$ANDROID_ABI" --executable "webserver/build/generated/webserverJniLibs/debug/$ANDROID_ABI/libwebserver_exec.so" | tee native-abi-result.txt
          printf '%s\n' "$GITHUB_SHA" > NATIVE-SOURCE-COMMIT.txt
      - name: Preserve exact ABI package and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-${{ matrix.abi }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/intermediates/apk/debug/*.apk
            native-abi-result.txt
            NATIVE-SOURCE-COMMIT.txt
            webserver/build/official-openssl/${{ matrix.abi }}/BUILD-IDENTITY
          if-no-files-found: warn

  runtime:
    name: Production x86_64 native runtime (API35)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore pinned x86_64 OpenSSL output
        uses: actions/cache@v4
        with:
          path: webserver/build/official-openssl/x86_64
          key: official-openssl-x86_64-ndk28-${{ runner.os }}-${{ hashFiles('webserver/scripts/build-official-openssl.sh') }}
      - name: Enable disposable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test actual packaged executables without root or trust-store changes
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 -PnativeAbi=x86_64 -Pandroid.injected.build.abi=x86_64 -Pandroid.testInstrumentationRunnerArguments.class=org.adaway.util.NativeAbiDeviceTest
      - name: Preserve actual native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-runtime-x86_64
          path: |
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          if-no-files-found: warn
