// Buildscript classpath repositories: required to resolve AGP itself.
// dependencyResolutionManagement (project dependencies) lives in
// settings.gradle — it is a Settings-scope API and cannot appear here.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        // Kotlin + Compose compiler plugins (applied without version in
        // module files; kept on the classpath alongside AGP to avoid
        // AGP 9's built-in Kotlin conflicting with a versioned request)
        classpath libs.kotlin.gradle.plugin
        classpath libs.kotlin.compose.compiler
    }
}

allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = "17"
    }
}
