// Buildscript classpath repositories: required to resolve AGP itself.
// dependencyResolutionManagement only governs *project* dependencies,
// so the buildscript block needs its own repository declarations.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
    }
}

// Project dependency repositories (settings-level, FAIL_ON_PROJECT_REPOS
// forbids declaring repositories inside module build files).
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // libsu (com.github.topjohnwu.libsu:core) is served from JitPack
        maven {
            url 'https://jitpack.io'
        }
    }
}

allprojects {
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions.jvmTarget = "11"
    }
}
